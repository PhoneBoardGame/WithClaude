<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#2a1018">
<title>러브레터</title>
<style>
:root{--bg:#2a1018;--paper:#f7efe0;--paper2:#eadcc1;--ink:#2b1a14;--muted:#7a6656;--gold:#d4ad55;--rose:#b73a52;--line:#d9c8a8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:#1c0a10 radial-gradient(130% 70% at 50% 0%,#521f2f 0%,#2a1018 55%,#16070c 100%) fixed;color:var(--paper);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-text-size-adjust:100%}
#app{max-width:480px;margin:0 auto;min-height:100vh;padding:calc(env(safe-area-inset-top) + 8px) 0 calc(env(safe-area-inset-bottom) + 84px)}
.serif{font-family:"Nanum Myeongjo","Noto Serif KR",AppleMyungjo,Batang,Georgia,serif}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:disabled{opacity:.4;cursor:default}
input{font:inherit;-webkit-user-select:text;user-select:text}
h1,h2,h3{margin:0}
.hint{color:#cdb8a6;font-size:13px;text-align:center;margin:8px 16px;line-height:1.5}
.warn{background:rgba(183,58,82,.25);border:1px solid rgba(255,140,160,.35);color:#ffd9df;font-size:13px;border-radius:10px;padding:8px 12px;margin:10px 16px;text-align:center}

/* buttons */
.btn{display:block;width:calc(100% - 32px);margin:12px 16px;padding:14px;border-radius:14px;font-weight:700;font-size:16px;text-align:center}
.btn.big{padding:18px;font-size:18px}
.btn.gold{background:linear-gradient(180deg,#e7c46f,#c39437);color:#2b1a0c;box-shadow:0 4px 0 #8a6421,0 8px 18px rgba(0,0,0,.35)}
.btn.rose{background:linear-gradient(180deg,#d0526a,#a02c45);color:#fff;box-shadow:0 4px 0 #6d1a2c,0 8px 18px rgba(0,0,0,.35)}
.btn.ghost{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.15);color:#ead7c6}
.btn:active:not(:disabled){transform:translateY(2px)}

/* setup */
.hero{text-align:center;padding:26px 16px 10px}
.hero h1{font-size:38px;letter-spacing:2px;color:#ffe9d2;text-shadow:0 2px 12px rgba(0,0,0,.5)}
.hero p{margin:6px 0 0;color:#d8bfa9;font-size:14px}
.seal{width:68px;height:68px;margin:0 auto 10px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#d9566e,#8e1f36);display:grid;place-items:center;font-size:30px;box-shadow:0 4px 14px rgba(0,0,0,.5),inset 0 -4px 8px rgba(0,0,0,.3)}
.panel{background:linear-gradient(180deg,var(--paper),var(--paper2));color:var(--ink);margin:12px 16px;border-radius:18px;padding:16px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.panel h2{font-size:15px;margin:14px 0 8px;color:#6b2335}
.panel h2:first-child{margin-top:0}
.panel h2 small{font-weight:400;color:var(--muted);font-size:12px}
.panel .hint{color:var(--muted)}
.seg{display:flex;gap:8px}
.segb{flex:1;padding:12px 8px;border-radius:12px;border:2px solid var(--line);background:#fffaf0;color:var(--ink);text-align:center}
.segb b{display:block;font-size:15px}.segb small{color:var(--muted);font-size:12px}
.segb.on{border-color:#a02c45;background:#fbe7ea}
.stepper{display:flex;align-items:center;justify-content:center;gap:18px}
.stepper button{width:52px;height:52px;border-radius:50%;background:#6b2335;color:#fff;font-size:26px;font-weight:700}
.stepper div{font-size:16px;min-width:70px;text-align:center}.stepper b{font-size:34px}
.namerow{display:flex;align-items:center;gap:10px;margin:6px 0}
.namerow .seat{width:30px;height:30px;border-radius:50%;background:#6b2335;color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px;flex:none}
.namerow input{flex:1;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:#fffaf0;color:var(--ink);font-size:16px}
.resume{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14px}
.resume .btn{width:auto;margin:0;padding:10px 16px;font-size:14px}

/* top bar */
.top{display:flex;align-items:center;gap:8px;padding:4px 10px 8px}
.ib{width:42px;height:42px;border-radius:12px;background:rgba(255,255,255,.08);font-size:20px;flex:none}
.stat{flex:1;display:flex;justify-content:center;gap:4px;flex-wrap:wrap;min-width:0}
.stat span{background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.1);border-radius:999px;padding:6px 8px;font-size:12.5px;color:#ead7c6;white-space:nowrap}
.stat b{color:#ffe1a6}
.tokens{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:10px 12px}
.tk{font-size:12.5px;padding:6px 10px;border-radius:999px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);color:#ead7c6}
.tk b{color:#ff9fb1}
.tk.cur{border-color:var(--gold);background:rgba(212,173,85,.18)}
.tk.out{opacity:.45;text-decoration:line-through}

/* handoff */
.handoff{text-align:center;padding:18px 16px 4px}
.turnlabel{font-size:13px;color:#d8bfa9;letter-spacing:1px}
.handoff h1{font-size:34px;color:#ffe9d2;margin-top:14px}
.handoff .q{font-size:20px;margin:8px 0 2px}
.envelope{width:150px;height:104px;margin:22px auto 6px;position:relative;background:linear-gradient(180deg,#f3e6cd,#e2cfa9);border-radius:8px;box-shadow:0 10px 24px rgba(0,0,0,.45)}
.envelope::before{content:'';position:absolute;inset:0;background:linear-gradient(to bottom right,transparent 49.5%,rgba(120,80,40,.25) 50%,transparent 51%),linear-gradient(to bottom left,transparent 49.5%,rgba(120,80,40,.25) 50%,transparent 51%);border-radius:8px}
.envelope::after{content:'♥';position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);width:38px;height:38px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#d9566e,#8e1f36);color:#ffd0d8;display:grid;place-items:center;font-size:18px;box-shadow:0 2px 6px rgba(0,0,0,.4)}
.log{font-size:14px}
.log h3{font-size:14px;color:#6b2335;margin-bottom:6px}
.li{padding:7px 0;border-top:1px dashed var(--line);line-height:1.45}
.li:first-of-type{border-top:0}

/* turn */
.turnhead{display:flex;align-items:center;justify-content:space-between;padding:4px 16px 2px}
.who{font-size:22px;font-weight:800;color:#ffe9d2}
.steps{display:flex;gap:4px;font-size:11px}
.steps span{padding:4px 7px;border-radius:999px;background:rgba(255,255,255,.07);color:#b9a291}
.steps span.on{background:var(--gold);color:#2b1a0c;font-weight:700}
.steps span.done{color:#e8d3c0}
.sec{font-size:14px;color:#e2c9b3;text-align:center;margin:16px 16px 6px;font-weight:600}
.hand{display:flex;gap:12px;justify-content:center;margin:8px 16px;align-items:flex-start}
.card{position:relative;flex:1 1 0;max-width:200px;aspect-ratio:5/7;background:linear-gradient(180deg,#fffaf0,var(--paper2));color:var(--ink);border-radius:14px;padding:10px 9px;box-shadow:0 6px 18px rgba(0,0,0,.4);border:3px solid var(--c);display:flex;flex-direction:column;align-items:center;text-align:center;transition:transform .15s,box-shadow .15s;overflow:hidden}
.card::before{content:'';position:absolute;left:0;right:0;top:0;height:40%;background:var(--c);opacity:.16}
.card>*{position:relative}
.cv{position:absolute!important;top:4px;left:9px;font-size:30px;font-weight:800;color:var(--c)}
.ci{font-size:44px;margin-top:16%;line-height:1}
.cn{font-size:20px;font-weight:800;margin-top:8px;color:var(--c);filter:brightness(.7)}
.cd{font-size:11.5px;line-height:1.4;color:#5a4636;margin-top:8px;word-break:keep-all}
.card[data-a]{cursor:pointer}
.card.sel{transform:translateY(-12px);box-shadow:0 0 0 4px var(--gold),0 16px 28px rgba(0,0,0,.5)}
.card.dis{opacity:.35;filter:grayscale(.7)}
.card.sm{max-width:120px;padding:6px}
.card.sm .cv{font-size:22px;left:7px}
.card.sm .ci{font-size:30px;margin-top:22%}
.card.sm .cn{font-size:15px;margin-top:6px}
.card.back{background:repeating-linear-gradient(45deg,#6b2335 0 10px,#58192a 10px 20px);border-color:var(--gold);color:#ffe9d2;justify-content:center;gap:8px;font-weight:700;font-size:15px;line-height:1.4}
.card.back::before{display:none}
.card.back small{font-weight:400;color:#f0d6b8;font-size:12px}
.hand.three .card{max-width:130px}
.played{display:flex;gap:14px;align-items:center;margin:14px 16px;background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:12px}
.played .card{flex:0 0 92px}
.msg{font-size:16px;line-height:1.55}
.msg b{color:#ffb3c0}
.reveal{display:flex;gap:14px;justify-content:center;margin:8px 16px}
.reveal>div{text-align:center;flex:0 1 130px}
.reveal .card{margin:0 auto}
.lbl{font-size:13px;color:#e2c9b3;margin-bottom:6px}
.dead{text-align:center;margin:20px 16px;font-size:18px;color:#ffb3c0}
.notes{background:rgba(212,173,85,.14);border:1px solid rgba(212,173,85,.45);border-radius:14px;margin:12px 16px;padding:10px 14px;font-size:14px}
.notes h3{font-size:13px;color:#ffe1a6;margin-bottom:4px}
.notes .li{border-top-color:rgba(212,173,85,.35)}
.targets{margin:6px 16px;display:grid;gap:8px}
.tg{display:flex;align-items:center;justify-content:space-between;padding:16px;border-radius:14px;background:linear-gradient(180deg,var(--paper),var(--paper2));color:var(--ink);font-weight:700;font-size:17px;box-shadow:0 4px 0 #a48e6c}
.tg small{font-weight:400;color:var(--muted);font-size:13px}
.tg:disabled{box-shadow:none}
.guess{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 16px}
.gb{background:linear-gradient(180deg,#fffaf0,var(--paper2));color:var(--ink);border-radius:12px;padding:10px 4px;border:2px solid var(--c);box-shadow:0 3px 0 rgba(0,0,0,.25)}
.gb .gv{font-size:22px;font-weight:800;color:var(--c)}
.gb .gi{font-size:22px}
.gb .gn{font-size:13px;font-weight:700}
.chip{display:inline-flex;align-items:center;gap:3px;font-size:12px;padding:2px 7px 2px 3px;border-radius:999px;background:#fffaf0;border:1.5px solid var(--c);color:var(--ink);margin:2px 2px 0 0;white-space:nowrap}
.chip b{background:var(--c);color:#fff;border-radius:50%;width:18px;height:18px;display:grid;place-items:center;font-size:11px}

/* round end */
.banner{text-align:center;padding:18px 16px 6px}
.banner .crown{font-size:46px}
.banner h1{font-size:28px;color:#ffe9d2;margin-top:6px}
.banner p{color:#e2c9b3;margin:6px 0 0;font-size:14px;line-height:1.5}
.rows .row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px dashed var(--line)}
.rows .row:first-child{border-top:0}
.row .nm{flex:1;font-weight:700}
.row .nm small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.row.win .nm{color:#a02c45}
.hearts{letter-spacing:1px;color:#c2344f;font-size:14px;white-space:nowrap}
.hearts i{font-style:normal;color:#d9c8a8}

/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(10,3,6,.65);z-index:10;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{width:100%;max-width:480px;max-height:86vh;overflow:auto;background:linear-gradient(180deg,var(--paper),var(--paper2));color:var(--ink);border-radius:22px 22px 0 0;padding:14px 16px calc(env(safe-area-inset-bottom) + 20px);animation:up .2s ease-out;-webkit-overflow-scrolling:touch}
.sheet .grab{width:44px;height:5px;border-radius:3px;background:#cdb894;margin:0 auto 10px}
.sheet h2{font-size:18px;color:#6b2335;margin:6px 0 10px}
.sheet h3{font-size:14px;color:#6b2335;margin:16px 0 6px}
.kv{display:flex;gap:8px;flex-wrap:wrap}
.kv div{flex:1;min-width:90px;background:#fffaf0;border:1px solid var(--line);border-radius:12px;padding:8px;text-align:center;font-size:12px;color:var(--muted)}
.kv b{display:block;font-size:22px;color:var(--ink)}
.pl{background:#fffaf0;border:1px solid var(--line);border-radius:12px;padding:10px;margin:6px 0}
.pl .h{display:flex;justify-content:space-between;align-items:center;font-weight:700}
.pl .st{font-size:12px;font-weight:400;color:var(--muted)}
.pl.out{opacity:.6}
.pl .ds{margin-top:4px;font-size:12px;color:var(--muted)}
table.ref{width:100%;border-collapse:collapse;font-size:12.5px}
table.ref td,table.ref th{padding:7px 4px;border-top:1px solid var(--line);vertical-align:top;text-align:left}
table.ref th{font-size:11.5px;color:var(--muted);font-weight:600}
table.ref td.n{text-align:center;white-space:nowrap}
table.ref .cname{font-weight:700;white-space:nowrap}
.sheet .btn{width:100%;margin:10px 0 0}
.card.wd.sm{aspect-ratio:auto;min-height:168px}
.card.wd.sm .ci{margin-top:22px}
.card.wd.sm .cd{font-size:10.5px;margin-top:5px}
.hand.three.wdesc{flex-wrap:wrap}
.hand.three.wdesc .card{flex:0 0 calc(50% - 6px);max-width:none}
.pdesc{margin-top:8px;font-size:12.5px;line-height:1.45;color:#e8d3c0;border-top:1px dashed rgba(255,255,255,.2);padding-top:7px;word-break:keep-all}
.guess.wdesc{grid-template-columns:repeat(2,1fr)}
.gd{font-size:11px;line-height:1.35;color:#5a4636;margin-top:4px;word-break:keep-all}
.bottombar{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;justify-content:center;padding:10px 16px calc(env(safe-area-inset-bottom) + 10px);background:linear-gradient(180deg,rgba(22,7,12,0),rgba(22,7,12,.92) 35%)}
.toggle{display:flex;align-items:center;gap:10px;padding:9px 14px 9px 16px;border-radius:999px;background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.15);font-size:14px;color:#ead7c6}
.sw{width:44px;height:26px;border-radius:13px;background:#5a4a50;position:relative;transition:background .15s}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s}
.toggle.on .sw{background:var(--gold)}
.toggle.on .sw::after{left:21px}
.toggle b{min-width:28px;text-align:left}
@keyframes up{from{transform:translateY(40px);opacity:.5}}
@keyframes fade{from{opacity:0}}

/* mode select & online */
.mode{display:flex;flex-direction:column;align-items:center;gap:4px;width:calc(100% - 32px);margin:14px 16px;padding:22px 16px;border-radius:18px;background:linear-gradient(180deg,var(--paper),var(--paper2));color:var(--ink);box-shadow:0 6px 0 #9b8461,0 12px 24px rgba(0,0,0,.4)}
.mode .mi{font-size:32px}.mode b{font-size:20px;color:#6b2335}.mode small{color:var(--muted);font-size:13px}
.mode:active{transform:translateY(3px)}
.backlink{display:inline-block;margin:2px 10px 0;padding:8px 10px;color:#e2c9b3;font-size:14px}
.tin{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:#fffaf0;color:var(--ink);font-size:17px}
.tin.code{text-transform:uppercase;letter-spacing:8px;text-align:center;font-weight:800;font-size:24px}
.qrbox{text-align:center}
.qrbox img{width:220px;height:220px;border-radius:12px;background:#fffaf0;padding:8px;border:1px solid var(--line)}
.bigcode{font-size:36px;letter-spacing:10px;font-weight:800;color:#6b2335;text-align:center;margin:4px 0}
.url{font-size:11px;color:var(--muted);word-break:break-all;text-align:center;-webkit-user-select:text;user-select:text}
.tag{font-size:11px;font-weight:400;background:#6b2335;color:#fff;border-radius:6px;padding:1px 6px;margin-left:4px}
.ostat{display:flex;justify-content:center;align-items:center;gap:8px;margin:0 14px;font-size:14px;color:#e2c9b3}
.ostat b{color:#ffe1a6}
.lastlog{display:block;width:calc(100% - 28px);margin:2px 14px 0;font-size:12.5px;color:#cdb8a6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
.tablewrap{position:relative;height:46vh;min-height:330px;max-height:440px;margin:6px 6px 2px}
.pile{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;padding:6px;cursor:pointer}
.pile i{font-style:normal;width:20px;height:27px;border-radius:3px;background:#fffaf0;border:2px solid var(--c);color:var(--c);font-size:12px;font-weight:800;display:grid;place-items:center;margin-left:-12px;box-shadow:-2px 1px 4px rgba(0,0,0,.45)}
.pile i:first-of-type{margin-left:0}
.pile .more{font-size:10px;color:#f3e2cf;margin-right:3px}
.felt{position:absolute;inset:13% 11%;border-radius:50%;background:radial-gradient(circle,#6b2335 0%,#47152a 70%,#36101f 100%);border:3px solid rgba(212,173,85,.55);box-shadow:inset 0 0 30px rgba(0,0,0,.5),0 10px 30px rgba(0,0,0,.4)}
.deck{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:0;font-size:12px;color:#ffe9d2;cursor:pointer}
.deck .stack{position:relative;width:38px;height:53px}
.deck .stack i{position:absolute;left:0;bottom:0;width:38px;height:53px;border-radius:6px;box-shadow:-1px 1px 2px rgba(0,0,0,.35);background:repeating-linear-gradient(45deg,#7a2a3e 0 6px,#5e1d2f 6px 12px);border:2px solid var(--gold)}
.deck b{color:#ffe1a6;font-size:13px}
.deck .dkc{position:absolute;bottom:-9px;left:50%;transform:translateX(-50%);background:rgba(20,6,10,.85);border:1px solid var(--gold);border-radius:999px;padding:1px 8px;font-size:11px;white-space:nowrap;z-index:2}
.deck .stack.few i{box-shadow:-2px 2px 4px rgba(0,0,0,.5)}
.deck .stack.empty{width:38px;height:53px;border:2px dashed rgba(212,173,85,.5);border-radius:6px}
.seat{position:absolute;transform:translate(-50%,-50%);width:86px;text-align:center;font-size:12px;color:#f3e2cf}
.sname{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:2px 6px;border-radius:999px;background:rgba(0,0,0,.5)}
.seat.cur .sname{background:var(--gold);color:#2b1a0c}
.seat.out{opacity:.45}
.sbacks{display:flex;justify-content:center;align-items:center;gap:3px;margin:4px 0 2px;min-height:40px;cursor:pointer}
.mb{width:28px;height:39px;border-radius:4px;background:repeating-linear-gradient(45deg,#7a2a3e 0 4px,#5e1d2f 4px 8px);border:1.5px solid var(--gold);box-shadow:0 2px 4px rgba(0,0,0,.4)}
.seat.cur .mb{box-shadow:0 0 0 2px #ffe1a6,0 0 12px rgba(255,225,166,.6)}
.sbacks em{font-style:normal;font-size:11px;color:#ffb3c0}
.sbacks em.stk{color:#ff9fb1;font-size:11.5px;margin-left:3px;align-self:flex-end}
.smemo{display:flex;gap:2px;justify-content:center;flex-wrap:wrap}
.smemo span{font-size:10.5px;padding:1px 5px;border-radius:6px;background:#ffe1a6;color:#2b1a0c}
.smemo span.x{background:rgba(255,255,255,.22);color:#f3e2cf}
.sdisc{display:flex;gap:2px;justify-content:center;margin-top:3px;min-height:16px;cursor:pointer}
.sdisc i{font-style:normal;width:15px;height:17px;border-radius:3px;background:var(--c);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center}
.stok{color:#ff9fb1;font-size:11.5px;margin-top:1px}
.memark{position:absolute;left:50%;transform:translate(-50%,-50%);font-size:11px;color:#e2c9b3;background:rgba(0,0,0,.4);padding:2px 9px;border-radius:999px}
.mine{background:rgba(0,0,0,.28);border-top:1px solid rgba(255,255,255,.12);border-radius:22px 22px 0 0;padding:6px 0 10px;margin-top:2px}
.mine.busy{opacity:.6;pointer-events:none}
.minehead{display:flex;justify-content:space-between;align-items:center;margin:6px 16px 0}
.minehead b{color:#ffe9d2;font-size:16px}
.conn{background:rgba(183,58,82,.3);color:#ffd9df;font-size:12.5px;text-align:center;padding:6px;margin:0 14px 6px;border-radius:10px}
.zoomwrap{display:flex;justify-content:center;padding:6px 0}
.zoomwrap .card{max-width:260px;width:72%;flex:none;aspect-ratio:5/7;min-height:0}
.zoomwrap .card .cd{font-size:14px}
.zoomwrap .card .ci{font-size:64px}
.zoomwrap .card .cn{font-size:26px}
.zoomwrap .card .cv{font-size:40px}

  peers:[],order:[],names:{},lobby:[],hostName:'',sv:null,seq:0,actN:0,lastN:{},pending:false,pt:null,
  err:'',busy:false,memo:{},qr:null,qrFor:'',qrTries:0,hostSeen:false,me:-1,connected:true,peer:null,conn:null,conns:{},rt:null,notFound:false};

const V=t=>ED().values[t];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safe=s=>String(s==null?'':s).replace(/<(?!\/?b>)[^>]*>/g,'');
function hasBatchim(s){
  const ch=s.charCodeAt(s.length-1);
  if(ch>=0xAC00&&ch<=0xD7A3)return (ch-0xAC00)%28!==0;
  if(ch>=48&&ch<=57)return '013678'.includes(s.slice(-1));
  return false;
}
const jo=(s,a,b)=>esc(s)+(hasBatchim(s)?a:b);
/* 이름 표시: AI는 이름 앞에 🤖 아이콘을 붙여서 보여 줌 (이름 자체엔 아이콘 없음) */
const bareName=n=>String(n==null?'':n).replace(/^🤖+/,'');
const dispName=(n,bot)=>(bot?'🤖':'')+esc(bareName(n));
const nm=i=>G.players[i]?dispName(G.players[i].name,G.players[i].bot):'?';
const P=(i,a,b)=>G.players[i]?(G.players[i].bot?'🤖':'')+jo(bareName(G.players[i].name),a,b):'?';
const MEDIEVAL=['에드먼드','로잘린','기욤','이졸데','퍼시벌','엘레노어','가웨인','베아트리체','롤랑','마틸다','알라릭','세실리아','오스윈','로웨나','트리스탄','이베트','고드프리','브리짓','레지널드','아델라','휴버트','엘로이즈','볼드윈','이사벨','세드릭','오필리아','레오폴드','길리언'];
function botName(exceptPid){
  const used=new Set(Object.entries(O.names||{}).filter(([p])=>p!==exceptPid).map(([,n])=>bareName(n)));
  const free=MEDIEVAL.filter(n=>!used.has(n));
  return free.length?free[Math.floor(rnd()*free.length)]:'기사'+(used.size+1);
}
const C=(t,a,b)=>jo(TYPES[t].name,a,b);
function rnd(){try{const u=new Uint32Array(1);crypto.getRandomValues(u);return u[0]/4294967296}catch(e){return Math.random()}}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const rid=()=>Array.from({length:12},()=>'abcdefghijklmnopqrstuvwxyz0123456789'[Math.floor(rnd()*36)]).join('');
const randCode=()=>Array.from({length:4},()=>'abcdefghjkmnpqrstuvwxyz23456789'[Math.floor(rnd()*31)]).join('');

/* ---------- 소리 · 진동 (외부 파일 없이 브라우저에서 직접 만듦) ---------- */
const SND={sfx:true,bgm:true,vib:true,ctx:null,master:null,bgmGain:null,timer:null,pos:0,next:0,drone:null,lastTick:null};
try{const p=JSON.parse(localStorage.getItem(KEY+'-snd')||'{}');['sfx','bgm','vib'].forEach(k=>{if(p[k]===false)SND[k]=false})}catch(e){}
function saveSnd(){try{localStorage.setItem(KEY+'-snd',JSON.stringify({sfx:SND.sfx,bgm:SND.bgm,vib:SND.vib}))}catch(e){}}
function actx(){
  if(SND.ctx)return SND.ctx;
  const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return null;
  try{
    const c=new AC();SND.ctx=c;
    SND.master=c.createGain();SND.master.gain.value=0.7;SND.master.connect(c.destination);
    SND.bgmGain=c.createGain();SND.bgmGain.gain.value=0.16;SND.bgmGain.connect(SND.master);
  }catch(e){SND.ctx=null}
  return SND.ctx;
}
function unlockAudio(){
  if(!SND.sfx&&!SND.bgm)return;
  const c=actx();if(!c)return;
  if(c.state==='suspended')c.resume().catch(()=>{});
  if(SND.bgm)startBGM();
}
const mf=m=>440*Math.pow(2,(m-69)/12);
function tone(f,t,dur,o={}){
  const c=SND.ctx;if(!c)return;
  const os=c.createOscillator(),g=c.createGain();
  os.type=o.type||'triangle';os.frequency.setValueAtTime(f,t);
  if(o.to)os.frequency.exponentialRampToValueAtTime(o.to,t+dur);
  const v=o.vol==null?0.3:o.vol;
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v,t+(o.att||0.008));
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  let node=os;
  if(o.lp){const f2=c.createBiquadFilter();f2.type='lowpass';f2.frequency.value=o.lp;os.connect(f2);node=f2}
  node.connect(g);g.connect(o.dest||SND.master);
  os.start(t);os.stop(t+dur+0.05);
}
function noise(t,dur,o={}){
  const c=SND.ctx;if(!c)return;
  const len=Math.max(1,Math.floor(c.sampleRate*dur)),b=c.createBuffer(1,len,c.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*(1-i/len);
  const s=c.createBufferSource();s.buffer=b;
  const f=c.createBiquadFilter();f.type=o.type||'bandpass';f.frequency.setValueAtTime(o.f||2000,t);
  if(o.to)f.frequency.exponentialRampToValueAtTime(o.to,t+dur);f.Q.value=o.q||1.2;
  const g=c.createGain();g.gain.value=o.vol||0.25;
  s.connect(f);f.connect(g);g.connect(SND.master);s.start(t);
}
/* 효과음 */
function sfx(name){
  if(!SND.sfx)return;
  const c=actx();if(!c||c.state!=='running')return;
  const t=c.currentTime+0.01;
  switch(name){
    case 'draw':noise(t,0.16,{f:900,to:3500,vol:0.22});break;
    case 'play':noise(t,0.07,{f:1800,vol:0.18});tone(150,t,0.12,{type:'sine',vol:0.25,to:90});break;
    case 'shuffle':for(let k=0;k<4;k++)noise(t+k*0.07,0.08,{f:1200+k*400,vol:0.15});break;
    case 'turn':tone(mf(76),t,0.25,{vol:0.22});tone(mf(83),t+0.12,0.4,{vol:0.2});break;
    case 'kill':noise(t,0.05,{f:5000,type:'highpass',vol:0.25});tone(1320,t,0.35,{type:'square',vol:0.06,lp:4000});tone(1760,t+0.01,0.3,{type:'square',vol:0.05,lp:4000});tone(110,t,0.25,{type:'sine',vol:0.35,to:55});break;
    case 'die':[69,65,62,57].forEach((m,k)=>tone(mf(m),t+k*0.16,0.45,{type:'sine',vol:0.22}));tone(mf(45),t+0.5,0.9,{type:'triangle',vol:0.2,lp:600});break;
    case 'out':tone(mf(57),t,0.3,{type:'sine',vol:0.15,to:mf(50)});break;
    case 'win':[72,76,79,84].forEach((m,k)=>tone(mf(m),t+k*0.11,0.5,{vol:0.22}));[72,76,79].forEach(m=>tone(mf(m),t+0.5,1.1,{vol:0.12}));break;
    case 'lose':tone(mf(67),t,0.3,{vol:0.15});tone(mf(64),t+0.18,0.5,{vol:0.13});break;
    case 'champ':[60,64,67,72,67,72,76,79].forEach((m,k)=>tone(mf(m),t+k*0.13,0.45,{vol:0.2}));[72,76,79,84].forEach(m=>tone(mf(m),t+1.1,1.6,{vol:0.1}));break;
    case 'deal':noise(t,0.09,{f:2600,to:1100,vol:0.13});tone(240,t+0.06,0.06,{type:'sine',vol:0.08});break;
    case 'tick':tone(1500,t,0.05,{type:'square',vol:0.05});break;
    case 'protect':tone(mf(84),t,0.5,{type:'sine',vol:0.12});tone(mf(88),t+0.08,0.5,{type:'sine',vol:0.1});break;
  }
}
function vib(p){if(!SND.vib)return;try{if(navigator.vibrate)navigator.vibrate(p)}catch(e){}}
/* 배경음악: D 도리안 류트 선율 + 낮은 지속음 (직접 작곡, 약 18초 반복) */
const BGM_MEL=[[74,2],[77,1],[76,1],[74,2],[69,2],[71,1],[72,1],[74,2],[72,1],[71,1],[69,2],[67,2],[69,1],[71,1],[72,2],[71,1],[69,1],[67,1],[65,1],[64,2],[62,4],
  [74,2],[77,1],[79,1],[81,2],[79,1],[77,1],[76,2],[74,1],[72,1],[71,2],[69,2],[67,1],[69,1],[71,1],[72,1],[74,2],[72,1],[71,1],[69,2],[67,1],[64,1],[62,4]];
const BGM_BASS=[50,48,43,45,50,48,43,50];
const BGM_EV=(()=>{const m={};let p=0;BGM_MEL.forEach(([n,l])=>{(m[p]=m[p]||[]).push([n,l]);p+=l});return {mel:m,len:p}})();
const EIGHTH=0.3;
function pluck(f,t,dur,vol){tone(f,t,dur,{type:'triangle',vol,att:0.004,lp:2600,dest:SND.bgmGain});tone(f*2,t,dur*0.5,{type:'sine',vol:vol*0.25,att:0.004,dest:SND.bgmGain})}
function startBGM(){
  const c=SND.ctx;if(!c||SND.timer||!SND.bgm||document.hidden)return;
  SND.next=c.currentTime+0.15;SND.pos=0;
  SND.timer=setInterval(()=>{
    const c=SND.ctx;if(!c)return;
    while(SND.next<c.currentTime+0.6){
      const p=SND.pos,t=SND.next;
      (BGM_EV.mel[p]||[]).forEach(([n,l])=>pluck(mf(n),t,Math.min(1.2,l*EIGHTH*1.6),0.5));
      if(p%4===0){const r=BGM_BASS[Math.floor(p/8)%BGM_BASS.length];pluck(mf(r-12),t,EIGHTH*3.5,0.45)}
      if(p%8===6)pluck(mf(BGM_BASS[Math.floor(p/8)%BGM_BASS.length]-5),t,EIGHTH*1.5,0.25);
      SND.pos=(p+1)%BGM_EV.len;SND.next+=EIGHTH;
    }
  },120);
  try{
    const g=c.createGain();g.gain.value=0.0001;g.gain.exponentialRampToValueAtTime(0.09,c.currentTime+2);
    const f=c.createBiquadFilter();f.type='lowpass';f.frequency.value=380;f.connect(g);g.connect(SND.bgmGain);
    const o1=c.createOscillator(),o2=c.createOscillator();o1.type=o2.type='sawtooth';o1.frequency.value=mf(38);o2.frequency.value=mf(45);o2.detune.value=4;
    o1.connect(f);o2.connect(f);o1.start();o2.start();SND.drone={o1,o2,g};
  }catch(e){}
}
function stopBGM(){
  clearInterval(SND.timer);SND.timer=null;
  const d=SND.drone;SND.drone=null;
  if(d){try{const c=SND.ctx;d.g.gain.setTargetAtTime(0.0001,c.currentTime,0.2);d.o1.stop(c.currentTime+1);d.o2.stop(c.currentTime+1)}catch(e){}}
}
document.addEventListener('visibilitychange',()=>{if(document.hidden)stopBGM();else if(SND.bgm&&SND.ctx&&SND.ctx.state==='running')startBGM()});
/* 상태 변화를 보고 알맞은 소리·진동 */
let SNAP=null;
function soundDiff(){
  if(!G||!G.R){SNAP=null;return}
  const R=G.R,me=NET()?O.me:-1;
  const S={r:G.roundNo,sc:G.screen,cur:G.cur,st:G.step,dk:R.deck.length,dc:R.discards.reduce((a,d)=>a+d.length,0),al:R.alive.map(x=>x?1:0).join(''),me};
  const P0=SNAP;SNAP=S;
  if(!P0||P0.me!==S.me)return;
  if(S.r!==P0.r){if(S.sc!=='roundEnd'&&S.sc!=='gameEnd')sfx('shuffle');return}
  if(S.sc==='roundEnd'&&P0.sc!=='roundEnd'){
    const won=G.last&&G.last.winners.includes(me);
    if(me<0||won){sfx('win');vib([80,60,80,60,200])}else sfx('lose');
  }
  if(S.sc==='gameEnd'&&P0.sc!=='gameEnd'){if(me<0||(G.champs||[]).includes(me)){sfx('champ');vib([100,50,100,50,300])}else sfx('lose')}
  if(S.dk<P0.dk)sfx('draw');
  if(S.dc>P0.dc&&S.al===P0.al)sfx('play');
  const gone=[];for(let i=0;i<S.al.length;i++)if(P0.al[i]==='1'&&S.al[i]==='0')gone.push(i);
  if(gone.length){
    if(me>=0&&gone.includes(me)){sfx('die');vib([300,100,300])}
    else if(me>=0&&P0.cur===me){sfx('kill');vib([60,40,60])}
    else if(me<0&&gone.includes(P0.cur)){sfx('die')}
    else if(me<0){sfx('kill')}
    else sfx('out');
  }
  if(me>=0&&S.sc==='turn'&&S.cur===me&&S.st==='draw'&&!(P0.cur===me&&P0.st==='draw'&&P0.sc==='turn')){sfx('turn');vib(200)}
}

function startGame(){

  G={mode:'local',ed:s.ed,players:Array.from({length:s.n},(_,i)=>({name:(s.names[i]||'').trim()||`플레이어 ${i+1}`,tokens:0})),
     target:ed.tokens[s.n],roundNo:0,starter:0};
  newRound();
}
function newRound(){
  const ed=ED(), n=G.players.length, deck=[];
  for(const [t,c] of Object.entries(ed.counts))for(let i=0;i<c;i++)deck.push(t);
  shuffle(deck);
  const setAside=deck.shift();
  const faceUp=n===2?deck.splice(0,3):[];
  const hands=G.players.map(()=>[deck.shift()]);
  G.roundNo++;
  G.R={deck,setAside,faceUp,hands,discards:G.players.map(()=>[]),alive:G.players.map(()=>true),
       prot:G.players.map(()=>false),notes:G.players.map(()=>[]),log:[],seen:G.players.map(()=>0),dnotes:G.players.map(()=>[])};
  G.cur=G.starter;G.step=null;G.T=null;G.resume=false;G.last=null;G.champs=null;
  addLog(`라운드 ${G.roundNo} 시작 — ${nm(G.cur)}부터 시계 방향`);
  G.dealAt=Date.now();G.dealMs=(typeof BOT_FAST!=='undefined'&&BOT_FAST)?0:dealTotal(n);
  if(G.mode==='online')startTurn();

    G.peekOrder=[];for(let k=1;k<n;k++)G.peekOrder.push((G.starter+k)%n);
    G.peekPos=0;G.peekShow=false;G.screen='peek';

}
function addLog(s){G.R.log.push(s)}
function note(j,s){if(j!==G.cur&&G.R.alive[j])G.R.notes[j].push(s)}
/* 버린 카드마다 '어떻게 버려졌는지' 기록 */
function dn(j){const R=G.R;if(!R.dnotes)R.dnotes=R.discards.map(d=>d.map(()=>''));while(R.dnotes[j].length<R.discards[j].length)R.dnotes[j].push('');return R.dnotes[j]}

function toResult(){G.step='result'}
function startTurn(){G.R.prot[G.cur]=false;G.screen='turn';G.step='draw';G.T=null;UI.sel=null;

/* 공개 정보: 경비병 추측이 빗나간 카드는 그 사람 손에 없음 (그 사람이 다시 뽑기 전까지) */

const IMMEDIATE=['princess','handmaid','countess','spy','chancellor'];
function playCard(k){
  const R=G.R,i=G.cur,c=R.hands[i].splice(k,1)[0];

/* 뒤로가기: 능력을 쓰기 전까지만 */
function undoStep(){
  if(G.step==='guess'){G.step='target';G.T.target=null;return true}
  if(G.step==='target'||G.step==='confirm'){
    const R=G.R,i=G.cur,c=G.T.card,d=R.discards[i];
    if(d[d.length-1]===c){d.pop();dn(i).pop()}
    const h=R.hands[i];h.splice(Math.min(G.T.k==null?h.length:G.T.k,h.length),0,c);
    G.T=null;G.step='choose';UI.sel=null;return true;
  }
  if(G.step==='draw'&&G.mode==='local'){G.screen='handoff';G.step=null;return true}

}
function applyEffect(){

    case 'princess':
      dset(i,'직접 냄 → 탈락');eliminate(i,'공주를 내서 탈락하며 공개');T.msg='공주를 내서 <b>탈락</b>했습니다.';
      addLog(`${P(i,'이','가')} 공주를 내고 <b>탈락</b>했습니다.`);return toResult();
    case 'handmaid':

      addLog(`${P(i,'이','가')} 시녀를 냈습니다. (다음 차례까지 보호)`);return toResult();
    case 'countess':

      addLog(`${P(i,'이','가')} 백작부인을 냈습니다.`);return toResult();
    case 'spy':
      dset(i,'냄 (라운드 끝에 보너스 확인)');T.msg='스파이를 냈습니다. (라운드 종료 시 보너스 확인)';

function chooseTarget(j){

    }else{

      addLog(`${P(i,'이','가')} 왕자로 ${j===i?'자신':nm(j)}의 카드를 버리게 함 (버린 카드: ${TYPES[d].name})`);
      note(j,`${P(i,'이','가')} 왕자를 써서 내 ${C(d,'을','를')} 버리고 새 카드를 받았습니다.`);

    addLog(`${P(i,'이','가')} 왕으로 ${P(j,'와','과')} 카드를 맞바꿨습니다.`);
    note(j,`${P(i,'이','가')} 왕으로 카드를 맞바꿨습니다. 넘겨준 카드: ${TYPES[b].name} → 받은 카드: ${TYPES[a].name}`);

}
function resolveGuard(g){

function chancellorKeep(k){

const roundOver=()=>aliveList().length<=1||G.R.deck.length===0;
function endTurn(){
  const R=G.R;R.seen[G.cur]=R.log.length;R.notes[G.cur]=[];
  if(roundOver())return roundEnd();
  G.cur=nextAlive(G.cur);
  if(G.mode==='online')startTurn();
  else{G.screen='handoff';G.step=null;G.T=null;UI.sel=null}
}
const dsum=j=>G.R.discards[j].reduce((s,t)=>s+V(t),0);
function roundEnd(){
  const R=G.R,alive=aliveList();let winners,reason;
  if(alive.length===1){winners=alive;reason='마지막까지 살아남았습니다.'}
  else{
    const mv=Math.max(...alive.map(j=>V(R.hands[j][0])));
    let c=alive.filter(j=>V(R.hands[j][0])===mv);
    reason=`덱이 다 떨어져 손 카드를 비교 — 가장 높은 카드 ${mv}`;
    if(c.length>1){
      const ms=Math.max(...c.map(dsum)),c2=c.filter(j=>dsum(j)===ms);
      reason+=c2.length<c.length?` (동점 → 버린 카드 합 ${ms}로 승리)`:` (동점, 버린 카드 합도 같아 공동 승리)`;
      c=c2;
    }
    winners=c;
  }
  winners.forEach(j=>G.players[j].tokens++);
  let spy=null;
  if(G.ed==='v2019'){const s=alive.filter(j=>R.discards[j].includes('spy'));if(s.length===1){spy=s[0];G.players[spy].tokens++}}
  const reach=G.players.map((_,j)=>j).filter(j=>G.players[j].tokens>=G.target);
  if(reach.length){const mx=Math.max(...reach.map(j=>G.players[j].tokens));G.champs=reach.filter(j=>G.players[j].tokens===mx)}
  G.last={winners,reason,spy,alive};
  G.starter=winners[0];
  G.screen='roundEnd';G.step=null;G.T=null;G.auto=false;G.deadline=null;
}
function rematch(){G.players.forEach(p=>p.tokens=0);G.roundNo=0;G.starter=0;newRound()}

/* ---------- AI 플레이어 ---------- */
const pickR=a=>a[Math.floor(rnd()*a.length)];
function learn(s,about,c){const R=G.R;if(!G.players[s]||!G.players[s].bot)return;R.known=R.known||{};(R.known[s]=R.known[s]||{})[about]={c,d:R.discards[about].length}}
function botKnown(s,j){const k=G.R.known&&G.R.known[s]&&G.R.known[s][j];return k&&G.R.alive[j]&&G.R.discards[j].length===k.d?k.c:null}
function unseenCounts(s){const c={...ED().counts},R=G.R;[...R.discards.flat(),...R.faceUp,...R.hands[s]].forEach(t=>{if(c[t]>0)c[t]--});return c}
function botChoosePlay(s){
  const h=G.R.hands[s];
  if(isForced(h))return h.indexOf('countess');
  let best=0,bs=1e9;
  h.forEach((t,k)=>{
    const o=h[1-k];let sc=V(t);
    if(t==='princess')sc+=1000;
    if(t==='baron')sc+=V(o)>=V('prince')?-4:V(o)<=V('priest')?6:1;
    if(t==='king'&&o==='princess')sc+=30;
    if(t==='prince'&&o==='princess'&&!validTargets('prince').some(j=>j!==s))sc+=1000;
    if(t==='guard'&&G.players.some((_,j)=>j!==s&&!G.R.prot[j]&&botKnown(s,j)&&botKnown(s,j)!=='guard'))sc-=5;
    if(t==='guard'&&G.players.some((_,j)=>j!==s&&!G.R.prot[j]&&countessTell(j)))sc-=2;
    if(t==='spy')sc-=1;
    sc+=rnd()*0.6;
    if(sc<bs){bs=sc;best=k}
  });
  return best;
}
function botLeader(list){if(rnd()<0.5)return pickR(list);const m=Math.max(...list.map(j=>G.players[j].tokens));return pickR(list.filter(j=>G.players[j].tokens===m))}
function botTarget(s,c){
  const tg=validTargets(c),others=tg.filter(j=>j!==s);
  if(!others.length)return tg[0];
  const known=others.filter(j=>botKnown(s,j));
  const mine=G.R.hands[s][0];
  if(c==='guard'){const k=known.filter(j=>botKnown(s,j)!=='guard');if(k.length)return pickR(k);
    const tell=others.filter(countessTell);if(tell.length&&rnd()<0.8)return pickR(tell)}
  if(c==='baron'&&mine){const k=known.filter(j=>V(botKnown(s,j))<V(mine));if(k.length)return pickR(k)}
  if(c==='prince'){const k=known.filter(j=>botKnown(s,j)==='princess');if(k.length)return k[0]}
  if(c==='priest'){const u=others.filter(j=>!botKnown(s,j));if(u.length)return botLeader(u)}
  if(c==='king'&&mine){const k=known.filter(j=>V(botKnown(s,j))>V(mine));if(k.length)return k[0]}
  return botLeader(others);
}
/* 상대가 백작부인을 마지막으로 냈고, 그 뒤 손 카드가 바뀌지 않았으면 → 왕/왕자일 가능성 높음 */
function countessTell(j){const R=G.R,d=R.discards[j],ex=exOf(j);return R.alive[j]&&d.length&&d[d.length-1]==='countess'&&!(R.taint&&R.taint[j])&&!(ex.includes('king')&&ex.includes('prince'))}
function guessWeights(s,j){
  const u=unseenCounts(s),w={},maxV=Math.max(...Object.values(ED().values));
  const held=Math.max(0,G.R.discards[j].length-1); // 오래 들고 있을수록 높은 카드일 가능성 ↑
  for(const t in u){
    if(t==='guard'||u[t]<=0||exOf(j).includes(t))continue;
    let x=u[t]*(1+0.25*Math.min(held,3)/3*V(t)/maxV);
    if(countessTell(j)&&(t==='king'||t==='prince'))x*=5;
    w[t]=x;
  }
  return w;
}
function botGuess(s,j){
  const k=botKnown(s,j);if(k&&k!=='guard')return k;
  const w=guessWeights(s,j);let best=null,bs=-1;
  for(const t in w){const sc=w[t]*(0.85+0.3*rnd());if(sc>bs){bs=sc;best=t}}
  return best||pickR(Object.keys(ED().counts).filter(t=>t!=='guard'));
}
function botAction(){
  const s=G.cur,R=G.R;
  switch(G.step){
    case 'draw':return ['draw'];
    case 'choose':return ['play',botChoosePlay(s)];
    case 'target':return ['tgt',botTarget(s,G.T.card)];
    case 'guess':return ['guess',botGuess(s,G.T.target)];
    case 'chKeep':{const h=R.hands[s];let k=0;h.forEach((t,i)=>{if(V(t)>V(h[k]))k=i});return ['keep',k]}
    case 'chOrder':return ['bottom',rnd()<.5?0:1];
    case 'result':return ['end'];
  }
  return [];
}

/* 검증된 게임 행동 (각자 휴대폰 모드에서 방장이 사용) */
function applyGame(s,a,v){
  if(!G||G.screen!=='turn'||G.cur!==s)return false;
  const R=G.R,h=R.hands[s];
  switch(a){
    case 'draw':if(G.step==='draw'){doDraw();return true}break;
    case 'play':{const k=+v;if(G.step!=='choose'||!(k>=0&&k<h.length))break;if(isForced(h)&&h[k]!=='countess')break;playCard(k);return true}
    case 'tgt':{const j=+v;if(G.step==='target'&&validTargets(G.T.card).includes(j)){chooseTarget(j);return true}break}
    case 'guess':if(G.step==='guess'&&ED().counts[v]&&v!=='guard'){resolveGuard(v);return true}break;
    case 'keep':{const k=+v;if(G.step==='chKeep'&&k>=0&&k<h.length){chancellorKeep(k);return true}break}
    case 'bottom':{const k=+v;if(G.step==='chOrder'&&(k===0||k===1)){chancellorBottom(k);return true}break}
    case 'end':if(G.step==='result'){endTurn();return true}break;
    case 'undo':if(G.step==='target'||G.step==='guess')return undoStep();break;
  }
  return false;
}

async function libReady(){for(let k=0;k<50&&typeof Peer!=='function';k++)await new Promise(r=>setTimeout(r,100));return typeof Peer==='function'}
function openPeer(id){
  return new Promise((res,rej)=>{
    let done=false,p;
    try{p=id?new Peer(id,{debug:0}):new Peer({debug:0})}catch(e){rej(e);return}
    const t=setTimeout(()=>{if(done)return;done=true;try{p.destroy()}catch(e){}rej({type:'timeout'})},15000);
    p.on('open',()=>{if(done)return;done=true;clearTimeout(t);res(p)});
    p.on('error',e=>{if(done)return;done=true;clearTimeout(t);try{p.destroy()}catch(_){}rej(e)});
  });
}
function watchSignal(peer){
  peer.on('disconnected',()=>{O.connected=false;render();setTimeout(()=>{try{if(!peer.destroyed&&peer.disconnected)peer.reconnect()}catch(e){}},1500)});

function lobbyList(){return [{pid:O.pid,name:O.name},...O.order.map(pid=>({pid,name:O.names[pid]||'?'}))]}
const isBotPid=p=>typeof p==='string'&&p.startsWith('bot-');
const connectedPids=()=>{const s=new Set([O.pid]);Object.values(O.conns||{}).forEach(e=>{if(e.pid)s.add(e.pid)});O.order.filter(isBotPid).forEach(p=>s.add(p));if(G)G.players.forEach(p=>{if(p.bot)s.add(p.pid)});return s};

/* 방장: 사람마다 보여도 되는 정보만 담아 보냄 */
function viewFor(s){

function sendTo(entry){

/* ---- 예비 경로: MQTT 중계 서버 (직접 연결이 안 될 때) ---- */
const MQTT_URLS=['wss://broker.emqx.io:8084/mqtt','wss://broker.hivemq.com:8884/mqtt','wss://test.mosquitto.org:8081/mqtt'];
const TOPIC=code=>'loveletter-kr-v1/'+code;
async function mqttReady(){for(let k=0;k<50&&!(window.mqtt&&window.mqtt.connect);k++)await new Promise(r=>setTimeout(r,100));return !!(window.mqtt&&window.mqtt.connect)}
function mqttConnect(){
  return new Promise((res,rej)=>{
    let i=0;
    const tryOne=()=>{
      if(i>=MQTT_URLS.length)return rej(new Error('relay'));
      let c,done=false;
      try{c=window.mqtt.connect(MQTT_URLS[i++],{connectTimeout:6000,reconnectPeriod:3000,clean:true,clientId:'ll_'+rid()})}catch(e){return tryOne()}
      const t=setTimeout(()=>{if(done)return;done=true;try{c.end(true)}catch(e){}tryOne()},7000);
      c.on('connect',()=>{if(done)return;done=true;clearTimeout(t);res(c)});
      c.on('error',()=>{});
    };
    tryOne();
  });
}
const parseMsg=p=>{try{return JSON.parse(typeof p==='string'?p:new TextDecoder().decode(p))}catch(e){return null}};
async function hostRelay(){
  if(!(await mqttReady()))return false;
  let mq;try{mq=await mqttConnect()}catch(e){return false}
  if(O.role!=='host'){try{mq.end(true)}catch(e){}return false}
  O.mq=mq;const base=TOPIC(O.code);
  const sub=()=>{try{mq.subscribe(base+'/h')}catch(e){}};sub();mq.on('connect',sub);
  mq.on('message',(topic,payload)=>{
    const d=parseMsg(payload);if(!d||typeof d.g!=='string'||!d.m||typeof d.m!=='object')return;
    const g=d.g.slice(0,24),id='m:'+g;
    let e=O.conns[id];
    if(!e){const conn={peer:id,open:true,relay:true,send:x=>{try{mq.publish(base+'/g/'+g,JSON.stringify(x))}catch(_){}}};e=O.conns[id]={conn,pid:null,relay:true}}
    e.seen=Date.now();
    if(d.m.t==='ping'){e.conn.send({t:'pong'});if(!e.pid)e.conn.send({t:'who'});return}
    if(d.m.t==='bye'){hostOnClose(e.conn);return}
    hostOnData(e.conn,d.m);
  });
  clearInterval(O.mqSweep);
  O.mqSweep=setInterval(()=>{const now=Date.now();Object.values(O.conns).forEach(e=>{if(e.relay&&now-e.seen>20000)hostOnClose(e.conn)})},5000);
  render();return true;
}
function setupHost(peer){
  O.peer=peer;O.conns={};O.connected=true;
  hostRelay();
  if(!peer)return;
  peer.on('connection',conn=>{
    O.conns[conn.peer]={conn,pid:null};
    conn.on('data',d=>hostOnData(conn,d));
    conn.on('close',()=>hostOnClose(conn));
    conn.on('error',()=>hostOnClose(conn));
  });
  peer.on('error',()=>{});
  watchSignal(peer);
}
function hostOnData(conn,d){
  if(!d||typeof d!=='object')return;
  const e=O.conns[conn.peer]||(O.conns[conn.peer]={conn,pid:null});
  if(d.t==='hello'){
    const pid=String(d.pid||'').slice(0,24),name=String(d.name||'').trim().slice(0,8)||'?';
    if(!pid)return;
    e.pid=pid;
    if(O.phase==='lobby'){
      if(pid!==O.pid&&!O.order.includes(pid))O.order.push(pid);
      O.names[pid]=name;broadcast();saveOnline();
    }else{O.seq++;broadcast()}
    render();return;
  }
  if(d.t==='act'&&O.phase==='game'&&G&&e.pid){
    const s=G.players.findIndex(p=>p.pid===e.pid);
    const n=+d.n;
    if(s>=0&&n>(O.lastN[e.pid]||0)){
      O.lastN[e.pid]=n;
      if(applyGame(s,String(d.a),d.v)){broadcast();saveOnline();render();return}
    }
    O.seq++;sendTo(e); // 거절된 행동: 상태를 다시 보내 대기 해제
  }
}
function hostOnClose(conn){
  const e=O.conns[conn.peer];if(!e)return;
  delete O.conns[conn.peer];
  if(O.phase==='lobby'&&e.pid&&!connectedPids().has(e.pid)){O.order=O.order.filter(p=>p!==e.pid);saveOnline()}
  broadcast();render();
}
async function hostCreate(){
  O.name=O.name.trim().slice(0,8);
  if(!O.name){O.err='이름을 입력해 주세요.';return render()}
  if(BUILD==='artifact'){Object.assign(O,{code:'',role:'host',pid:O.pid||rid(),phase:'lobby',order:[],names:{},lastN:{},seq:0,busy:false,conns:{},peer:null,err:''});saveOnline();return render()}
  O.err='';O.busy=true;render();

  let peer=null,code='';

  }

  Object.assign(O,{code,role:'host',pid:O.pid||rid(),phase:'lobby',order:[],names:{},lastN:{},seq:0,busy:false});
  setupHost(peer);

}
async function hostResume(st){
  if(BUILD==='artifact'){
    Object.assign(O,{code:'',role:'host',pid:st.pid,name:st.name,ed:st.ed||'classic',order:st.order||[],names:st.names||{},lastN:{},seq:st.seq||0,busy:false,err:'',conns:{},peer:null,tl:st.tl||0});
    if(st.G){G=st.G;O.phase='game';O.me=G.players.findIndex(p=>p.pid===O.pid);if(G.deadline)G.deadline=Date.now()+(G.tl||0)*1000}else O.phase='lobby';
    render();scheduleBot();return;
  }
  O.busy=true;O.err='';render();
  if(!(await libReady())){O.busy=false;O.err=LIBFAIL;return render()}
  let peer=null;
  for(let tries=0;tries<20&&!peer;tries++){
    try{peer=await openPeer(PEER_PREFIX+st.code)}catch(e){
      if(e&&e.type==='unavailable-id'){O.err='방을 다시 여는 중… (잠시만요)';render();await new Promise(r=>setTimeout(r,3000))}

  Object.assign(O,{code:st.code,role:'host',pid:st.pid,name:st.name,ed:st.ed||'classic',order:st.order||[],names:st.names||{},lastN:st.lastN||{},seq:st.seq||0,busy:false,err:''});
  if(st.G){G=st.G;O.phase='game';O.me=G.players.findIndex(p=>p.pid===O.pid)}else{O.phase='lobby';O.order=[]}
  setupHost(peer);makeQR();render();scheduleBot();
}
function hostStart(){
  const list=lobbyList(),ed=EDITIONS[O.ed];

  G={mode:'online',ed:O.ed,tl:O.tl||0,players:list.map(p=>({pid:p.pid,name:p.name,tokens:0,bot:isBotPid(p.pid)})),target:ed.tokens[list.length],roundNo:0,starter:0};

async function guestJoin(code){
  O.name=O.name.trim().slice(0,8);

  if(!/^[a-z0-9]{4}$/.test(code)){O.err='방 코드 4자리를 확인해 주세요.';return render()}

function scheduleReconnect(){clearTimeout(O.rt);O.rt=setTimeout(connectHost,3000)}
function connectHost(){
  if(O.relay||!O.peer||O.peer.destroyed||O.role!=='guest')return;
  if(O.conn&&O.conn.open)return;
  let conn;
  try{conn=O.peer.connect(PEER_PREFIX+O.code,{reliable:true,serialization:'json'})}catch(e){return scheduleReconnect()}
  O.conn=conn;
  conn.on('open',()=>{if(O.relay){try{conn.close()}catch(e){}return}O.hostSeen=true;O.notFound=false;O.via='direct';clearTimeout(O.ft);try{conn.send({t:'hello',pid:O.pid,name:O.name})}catch(e){}render()});
  conn.on('data',guestOnData);
  const lost=()=>{if(O.relay||O.conn!==conn)return;O.hostSeen=false;O.pending=false;render();scheduleReconnect();

  if(O.role!=='guest'){try{mq.end(true)}catch(e){}return}

  try{if(O.conn&&O.conn.close)O.conn.close()}catch(e){}

  O.conn=conn;

  const sub=()=>{try{mq.subscribe(base+'/g/'+gid,{},()=>hello())}catch(e){}};sub();mq.on('connect',sub);
  mq.on('message',(t,p)=>{const d=parseMsg(p);if(!d)return;O.lastHost=Date.now();if(!O.hostSeen){O.hostSeen=true;render()}

function sanitizeState(st){
  try{
    if(!st||!EDITIONS[st.ed]||!Array.isArray(st.players)||!st.R)return null;
    const ok=t=>typeof t==='string'&&(TYPES[t]||t==='x');
    const R=st.R,N=st.players.length;
    if(N<2||N>6)return null;
    if(![...R.deck,...R.faceUp,...R.hands.flat(),...R.discards.flat()].every(ok))return null;
    if(R.setAside!=null&&!ok(R.setAside))return null;
    st.players.forEach(p=>{p.name=String(p.name).slice(0,8);p.pid=String(p.pid);p.tokens=+p.tokens||0;p.bot=!!p.bot});
    st.roundNo=+st.roundNo||0;st.target=+st.target||0;st.cur=+st.cur||0;st.starter=+st.starter||0;
    if(!Array.isArray(R.log))R.log=[];
    if(!Array.isArray(R.notes))R.notes=st.players.map(()=>[]);
    R.dnotes=Array.isArray(R.dnotes)?R.dnotes.map(a=>Array.isArray(a)?a.map(x=>String(x).slice(0,120)):[]):st.players.map(()=>[]);
    if(st.T){if(!TYPES[st.T.card])st.T=null;else{st.T.target=st.T.target==null?null:+st.T.target;st.T.reveal=(st.T.reveal||[]).filter(r=>TYPES[r.card]);if(st.T.rest&&!st.T.rest.every(t=>TYPES[t]))st.T.rest=null}}
    if(st.last){st.last.winners=(st.last.winners||[]).map(Number);st.last.alive=(st.last.alive||[]).map(Number);st.last.spy=st.last.spy==null?null:+st.last.spy}

function deckStack(n){
  if(!n)return '<div class="stack empty"></div>';
  const few=n<=5,layers=few?n:Math.min(n,14),off=few?5:1.3;
  let h='';for(let k=0;k<layers;k++)h+=`<i style="transform:translate(${(k*off).toFixed(1)}px,${(-k*off).toFixed(1)}px)"></i>`;
  const ext=Math.round((layers-1)*off);
  return `<div class="stack ${few?'few':''}" style="width:${38+ext}px;height:${53+ext}px;margin-top:${ext}px">${h}</div>`;
}

function checkDeal(){
  if(!G||!G.R||G.mode!=='online'||G.screen!=='turn'||!G.dealAt)return;
  if(UI.dealKey===G.dealAt)return;
  UI.dealKey=G.dealAt;
  const fresh=G.R.discards.every(d=>!d.length)&&G.step==='draw'&&G.cur===G.starter;
  if(!fresh)return;
  const N=G.players.length,order=[];for(let k=0;k<N;k++)order.push((G.starter+k)%N);
  UI.deal={t0:Date.now(),order,played:0};
}
function dealState(){
  const d=UI.deal;if(!d)return null;
  const e=Date.now()-d.t0,n=d.order.length+1;
  if(e>=n*DEAL_STEP+DEAL_FLY){UI.deal=null;return null}
  return {e,n,startOf:i=>i*DEAL_STEP,landed:i=>e>=i*DEAL_STEP+DEAL_FLY,started:i=>e>=i*DEAL_STEP};
}
function dealPending(){const ds=dealState();if(!ds)return 0;let k=0;for(let i=0;i<ds.n;i++)if(!ds.started(i))k++;return k}
function dealTick(){
  clearTimeout(UI.dealT);UI.dealT=null;
  const d=UI.deal;if(!d)return;
  const ds=dealState();
  if(ds){const st=Math.min(ds.n,Math.floor(ds.e/DEAL_STEP)+1);while(d.played<st){d.played++;sfx('deal')}}
  UI.dealT=setTimeout(()=>{UI.dealT=null;render();if(UI.deal)dealTick();else render()},90);
}

  else html=renderOnline();
  const sheet=renderSheet();
  const bar=`<div class="bottombar"><button class="toggle sndb" data-a="soundset" aria-label="소리 설정">${SND.bgm||SND.sfx?'🔊':'🔇'}</button><button class="toggle ${UI.desc?'on':''}" data-a="desc" aria-pressed="${UI.desc}"><span>부연설명</span><span class="sw"></span><b>${UI.desc?'ON':'OFF'}</b></button></div>`;
  if(NET()&&O.phase==='game'){checkDeal();if(UI.deal&&!UI.dealT)dealTick()}
  const tm=NET()&&G&&G.screen==='turn'&&O.phase==='game';
  const mn=document.querySelector&&document.querySelector('.mine'),mst=mn?mn.scrollTop:0,mkey=G?G.cur+':'+G.step:'';
  $app.className=tm?'tablemode':'';
  $app.innerHTML=html+bar+sheet;
  if(tm&&mst&&mkey===UI.mkey&&document.querySelector){const m2=document.querySelector('.mine');if(m2)m2.scrollTop=mst}
  UI.mkey=mkey;
  if(UI.sheet==='rename'&&document.querySelector){const inp=document.querySelector('input[data-rn]');if(inp&&UI.rnFocus){try{inp.focus();const l=inp.value.length;inp.setSelectionRange(l,l)}catch(e){}}}
  soundDiff();
  if(st&&document.querySelector){const s2=document.querySelector('.sheet');if(s2)s2.scrollTop=st}
  if(MODE==='local')save();
}

/* ---------- input ---------- */
const GAME_ACTS=['draw','play','tgt','guess','keep','bottom','end','next','final','again','undo'];
function act(a,v){
  if(a==='noop')return;
  const prevScreen=G&&G.screen, prevStep=G&&G.step;
  if(NET()&&G&&GAME_ACTS.includes(a)){onlineGameAct(a,v);render();return}
  switch(a){
    case 'desc':UI.desc=!UI.desc;try{localStorage.setItem(KEY+'-desc',UI.desc?'1':'0')}catch(e){}break;
    case 'mode':MODE=v;if(v==='online'){O.phase='menu';O.err=''}else{G=null}if(v==='solo'){G=null;O.phase='menu'}break;
    case 'back':MODE=null;G=null;break;
    case 'ed':UI.setup.ed=v;break;
    case 'n':UI.setup.n+=+v;break;
    case 'start':clearSave();startGame();break;
    case 'resume':{const s=load();if(s){G=s;if(!G.mode)G.mode='local';if(G.screen==='turn'){G.resume=true;G.screen='handoff'}if(G.screen==='peek')G.peekShow=false}break}
    case 'rules':UI.sheet='rules';break;
    case 'grules':UI.sheet='grules';break;
    case 'info':UI.sheet='info';break;
    case 'menu':UI.sheet='menu';break;
    case 'olog':UI.sheet='log';break;
    case 'spyinfo':UI.sheet='spy';break;
    case 'soundset':UI.sheet='sound';break;
    case 'snd':SND[v]=!SND[v];saveSnd();if(v==='bgm'){if(SND.bgm)unlockAudio();else stopBGM()}if(SND[v]&&v==='sfx'){unlockAudio();setTimeout(()=>sfx('turn'),50)}if(v==='vib'&&SND.vib)vib(100);break;
    case 'close':UI.sheet=null;UI.zoom=null;break;
    case 'home':
      if(MODE==='solo'){clearTimeout(O.bt);G=null;try{localStorage.removeItem(SKEY)}catch(e){}MODE=null;UI.sheet=null}
      else if(MODE==='online')leaveOnline();else{G=null;clearSave();UI.sheet=null}
      break;
    case 'pyes':G.peekShow=true;break;
    case 'pdone':G.peekShow=false;G.peekPos++;if(G.peekPos>=G.peekOrder.length)G.screen='handoff';break;
    case 'yes':if(G.resume){G.resume=false;G.screen='turn'}else startTurn();break;
    case 'draw':if(G.step==='draw')doDraw();break;
    case 'sel':UI.sel=+v;break;
    case 'play':if(UI.sel!=null){const k=UI.sel;UI.sel=null;playCard(k)}break;
    case 'tgt':chooseTarget(+v);break;
    case 'guess':resolveGuard(v);break;
    case 'keep':chancellorKeep(+v);break;
    case 'bottom':chancellorBottom(+v);break;
    case 'end':endTurn();break;
    case 'undo':undoStep();break;
    case 'confirm':if(G.step==='confirm')applyEffect();break;
    case 'next':newRound();break;
    case 'final':G.screen='gameEnd';break;
    case 'again':rematch();break;
    /* online */
    case 'o-ed':O.ed=v;break;
    case 'o-create':hostCreate();return;
    case 'o-join':guestJoin(O.hashCode||O.typedCode.trim().toLowerCase());return;
    case 'o-nocode':O.hashCode='';try{location.hash=''}catch(e){}break;
    case 'o-start':hostStart();break;
    case 'o-resume':{const st=loadOnline();if(st&&st.role==='host')hostResume(st);return}
    case 'o-tl':O.tl=+v;if(O.role==='host'&&O.phase==='lobby'){broadcast();saveOnline()}break;
    case 'nbots':O.nbots=(O.nbots||2)+(+v);break;
    case 'solostart':soloStart();break;
    case 'soloresume':{const sv=loadSolo();if(sv&&sv.G){MODE='solo';G=sv.G;Object.assign(O,{role:'host',pid:'me',name:sv.name||'나',ed:sv.ed||G.ed,phase:'game',conns:{},order:[],names:{},peer:null,mq:null,me:0});scheduleBot()}break}
    case 'o-addbot':if(O.role==='host'&&O.phase==='lobby'&&lobbyList().length<EDITIONS[O.ed].max){
      const pid='bot-'+rid().slice(0,8);O.names[pid]=botName();O.order.push(pid);broadcast();saveOnline()}break;
    case 'rnbot':if(O.role==='host'&&O.phase==='lobby'&&isBotPid(v)){UI.rnPid=v;UI.rnDraft=bareName(O.names[v]);UI.sheet='rename';UI.rnFocus=true}break;
    case 'rnrand':UI.rnDraft=botName(UI.rnPid);UI.rnFocus=false;break;
    case 'rnsave':{const n=bareName(UI.rnDraft).trim().slice(0,8);if(n&&UI.rnPid&&O.names[UI.rnPid]!=null){O.names[UI.rnPid]=n;broadcast();saveOnline()}UI.sheet=null;UI.rnFocus=false;break}
    case 'o-rmbot':if(O.role==='host'&&O.phase==='lobby'&&isBotPid(v)){O.order=O.order.filter(p=>p!==v);broadcast();saveOnline()}break;
    case 'zoom':{
      const me=NET()?O.me:G.cur,h=G.R.hands[me]||[],k=+v;
      if(!h[k])break;
      UI.zoom={t:h[k],k,play:NET()&&G.screen==='turn'&&G.cur===me&&G.step==='choose'&&!O.pending};
      UI.sheet='zoom';break;
    }
    case 'zoomc':if(TYPES[v]){UI.zoom={t:v,play:false};UI.sheet='zoom'}break;
    case 'zplay':{const z=UI.zoom;UI.sheet=null;UI.zoom=null;if(z&&z.play)onlineGameAct('play',z.k);break}
    case 'omemo':UI.seat=+v;UI.sheet='memo';break;
    case 'odisc':UI.seat=+v;UI.sheet='disc';break;
    case 'mguess':{const m=memoOf(G.players[UI.seat].pid);m.guess=m.guess===v?null:v;break}
    case 'mex':{const m=memoOf(G.players[UI.seat].pid);m.ex=m.ex.includes(v)?m.ex.filter(x=>x!==v):[...m.ex,v];break}
    case 'mclear':{const m=memoOf(G.players[UI.seat].pid);m.guess=null;m.ex=[];break}
  }
  render();
  if(MODE==='local'&&G&&(G.screen!==prevScreen||G.step!==prevStep))window.scrollTo(0,0);
}
document.addEventListener('click',e=>{
  unlockAudio();
  const b=e.target.closest('[data-a]');
  if(!b||b.disabled)return;
  e.stopPropagation();
  act(b.dataset.a,b.dataset.v);
});
document.addEventListener('input',e=>{
  const d=e.target.dataset||{};
  if(d.name!=null)UI.setup.names[+d.name]=e.target.value;
  if(d.oname!=null)O.name=e.target.value;
  if(d.ocode!=null)O.typedCode=e.target.value;
  if(d.rn!=null)UI.rnDraft=e.target.value;
});

/* ---------- boot ---------- */
(function boot(){
  const hm=(location.hash||'').match(/^#room-([a-z0-9]{4})$/i);
  if(hm&&BUILD==='web'){
    MODE='online';O.hashCode=hm[1].toLowerCase();
    const st=loadOnline();
    if(st&&st.code===O.hashCode){
      O.name=st.name||'';O.pid=st.pid;O.actN=st.actN||0;
      if(st.role==='host')hostResume(st);else guestJoin(O.hashCode);
    }
  }
  render();
})();
</script>
</body>
</html>
