<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#1a1830">
<title>다빈치 코드</title>
<style>
:root{--bg1:#232046;--bg2:#121024;--gold:#e9c46a;--ink:#f3efe6;--mute:#a9a3c2;--line:rgba(255,255,255,.13);--ok:#5fe39a;--bad:#ff7a7a;--sel:#ffd35a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;color:var(--ink);
  background:radial-gradient(120% 80% at 50% 0%,var(--bg1),var(--bg2));overflow:hidden;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;cursor:pointer}
#app{height:100%;max-width:520px;margin:0 auto;position:relative}

/* ---------- 설정 화면 ---------- */
.hubback{align-self:flex-start;width:auto;display:inline-flex;align-items:center;gap:4px;padding:7px 13px;border-radius:99px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);color:inherit;text-decoration:none;font-size:13px;font-weight:800;margin:0 0 4px}
.setup{height:100%;overflow:auto;padding:calc(18px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom))}
.logo{text-align:center;margin:8px 0 16px}
.logo .tiles{display:flex;justify-content:center;gap:5px;margin-bottom:10px}
.logo .tiles .t{--tw:34px;transform:rotate(var(--r))}
.logo h1{margin:0;font-size:28px;letter-spacing:-.5px;font-family:"Nanum Myeongjo","Noto Serif KR",serif}
.logo p{margin:4px 0 0;color:var(--mute);font-size:13px}
.card{background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}
.card h3{margin:0 0 10px;font-size:14.5px;display:flex;align-items:center;justify-content:space-between}
.card h3 small{font-weight:600;color:var(--mute);font-size:12px}
.prow{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px solid var(--line)}
.prow:first-of-type{border-top:0}
.prow .av{width:30px;height:30px;border-radius:10px;background:rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;font-size:16px;flex:0 0 auto}
.prow input{flex:1;min-width:0;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:rgba(0,0,0,.25);color:var(--ink);font:inherit;font-size:15px}
.prow .tag{font-size:11px;font-weight:800;color:var(--gold)}
.xbtn{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.06)}
.addai{width:100%;margin-top:8px;padding:11px;border-radius:12px;border:1px dashed rgba(255,255,255,.3);background:transparent;font-weight:800;color:var(--gold)}
.addai[disabled]{opacity:.4}
.opt{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.opt:first-of-type{border-top:0;padding-top:2px}
.opt .ol{flex:1}
.opt .ol b{display:block;font-size:14.5px}
.opt .ol span{display:block;font-size:12px;color:var(--mute);margin-top:2px;line-height:1.45}
.tog{width:52px;height:30px;border-radius:99px;border:0;background:rgba(255,255,255,.18);position:relative;flex:0 0 auto;transition:background .15s}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .15s}
.tog.on{background:#3cba74}.tog.on::after{left:25px}
.segs{display:flex;gap:6px;margin-top:8px}
.segs button{flex:1;padding:9px 0;border-radius:11px;border:1px solid var(--line);background:rgba(255,255,255,.05);font-weight:800;font-size:13.5px}
.segs button.on{background:var(--gold);color:#2a1d00;border-color:var(--gold)}
.big{display:block;width:100%;padding:16px;border-radius:16px;border:0;font-size:17px;font-weight:900;color:#2a1d00;background:linear-gradient(#f5d77f,#e3b54a);box-shadow:0 5px 0 #9c7623,0 10px 24px rgba(0,0,0,.35)}
.big:active{transform:translateY(3px);box-shadow:0 2px 0 #9c7623}
.sub{display:block;width:100%;margin-top:10px;padding:13px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.06);font-weight:800}
.foot{text-align:center;color:var(--mute);font-size:11.5px;margin-top:14px;line-height:1.5}

/* ---------- 패 ---------- */
.t{--tw:30px;position:relative;flex:0 0 auto;width:var(--tw);height:calc(var(--tw)*1.42);border-radius:calc(var(--tw)*.18);display:flex;align-items:center;justify-content:center;
  font-weight:900;font-size:calc(var(--tw)*.56);line-height:1;font-family:Georgia,"Times New Roman",serif}
.t.b{background:linear-gradient(160deg,#3a3946,#121119 70%);color:#f6f2e8;border:1px solid #5c5a6c;box-shadow:0 2px 0 #050408,0 3px 6px rgba(0,0,0,.4)}
.t.w{background:linear-gradient(160deg,#ffffff,#dcd8cf 75%);color:#1b1a22;border:1px solid #bdb8ad;box-shadow:0 2px 0 #8f8a80,0 3px 6px rgba(0,0,0,.35)}
.t .u{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:2px}
.t.back{color:transparent}
.t.back::before{content:"";position:absolute;inset:22%;border-radius:3px;border:1.5px solid currentColor;opacity:.0}
.t.back.b::after,.t.back.w::after{content:"?";position:absolute;color:rgba(255,255,255,.22);font-size:calc(var(--tw)*.5)}
.t.back.w::after{color:rgba(0,0,0,.2)}
.t.open{outline:2px solid #ff9b62;outline-offset:1px}
.t.open::before{content:"";position:absolute;top:-5px;right:-5px;width:11px;height:11px;border-radius:50%;background:#ff9b62;border:2px solid #1a1830}
.t.oppopen{outline:none}
.t.oppopen::before{display:none}
.t.pick{cursor:pointer}
.t.pick.back{animation:breathe 1.6s ease-in-out infinite}
@keyframes breathe{50%{box-shadow:0 0 0 3px rgba(255,211,90,.45),0 2px 0 #050408}}
.t.sel{outline:3px solid var(--sel);outline-offset:2px;transform:translateY(-6px)}
.t.deal{animation:deal .38s cubic-bezier(.2,.8,.3,1.2) both}
@keyframes deal{from{opacity:0;transform:translateY(-60px) scale(.6) rotate(-12deg)}}
.t.flip{animation:flip .6s ease both}
@keyframes flip{0%{transform:rotateY(90deg) scale(1.2)}60%{transform:rotateY(0) scale(1.25)}100%{transform:none}}
.t.shake{animation:shake .5s ease both}
@keyframes shake{20%,60%{transform:translateX(-4px)}40%,80%{transform:translateX(4px)}}
.t.new{animation:newin .5s ease both}
@keyframes newin{from{transform:translateY(-30px);opacity:0}}
.t.joker{font-size:calc(var(--tw)*.48)}
.t.peekable{cursor:pointer}
.t.peeked{opacity:.85;outline:2px dashed #8fd3ff;outline-offset:1px}
.row .dir{flex:0 0 auto;align-self:center;font-size:10px;font-weight:800;color:var(--mute);opacity:.7;writing-mode:vertical-rl;letter-spacing:1px}
.dirline{display:flex;justify-content:space-between;font-size:10.5px;font-weight:700;color:var(--mute);padding:0 4px;opacity:.85}
.miss{position:absolute;left:50%;top:100%;transform:translateX(-50%);margin-top:3px;font:700 9.5px/1.15 -apple-system,sans-serif;color:#ff9e9e;white-space:nowrap;text-align:center;letter-spacing:-.3px}

/* ---------- 게임 화면 ---------- */
.game{height:100%;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
.top{display:flex;align-items:center;gap:6px;padding:8px 10px 4px}
.top .ttl{flex:1;font-weight:800;font-size:14px;color:var(--mute);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{min-width:38px;height:36px;padding:0 9px;border-radius:11px;border:1px solid var(--line);background:rgba(255,255,255,.07);font-size:15px;font-weight:800;white-space:nowrap}
.ib.off{opacity:.45}
.hg{font-weight:900;color:var(--gold);font-size:13px;padding:0 4px;min-width:38px;text-align:center}
.hg.low{color:var(--bad);animation:blink .5s steps(2) infinite}
@keyframes blink{50%{opacity:.4}}
.opps{flex:1 1 auto;min-height:0;overflow:auto;padding:2px 10px 0;display:flex;flex-direction:column;gap:7px}
.opp{border-radius:14px;padding:7px 9px 8px;background:rgba(255,255,255,.05);border:1px solid var(--line);transition:background .2s}
.opp.cur{background:rgba(233,196,106,.13);border-color:rgba(233,196,106,.55)}
.opp.out{opacity:.45}
.opp.tgt{border-color:var(--sel)}
.oh{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:800;margin-bottom:6px}
.oh .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.oh small{color:var(--mute);font-weight:700;font-size:11px;white-space:nowrap}
.oh .st{margin-left:auto;font-size:11px;font-weight:800;color:var(--gold);white-space:nowrap}
.row{display:flex;gap:4px;justify-content:center;flex-wrap:nowrap;padding-bottom:2px}
.row.hasmiss{padding-bottom:14px}
.mid{flex:0 0 auto;padding:6px 10px;display:flex;align-items:center;gap:8px}
.pool{display:flex;gap:6px}
.stack{position:relative;border:0;padding:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:800;color:var(--mute)}
.stack .t{--tw:30px}
.stack .t::after{content:none}
.stack .cnt{position:absolute;top:3px;left:0;right:0;text-align:center;font:900 15px/1.6 -apple-system,sans-serif}
.stack.b .cnt{color:#fff}.stack.w .cnt{color:#222}
.stack.can .t{animation:breathe 1.4s ease-in-out infinite}
.stack[disabled]{opacity:.35}
.banner{flex:1;min-width:0;min-height:46px;border-radius:12px;padding:7px 10px;background:rgba(0,0,0,.25);font-size:12.5px;line-height:1.4;display:flex;align-items:center;gap:8px}
.banner .bt{flex:1;min-width:0}
.banner b{color:#fff}
.banner .ok{color:var(--ok);font-weight:900}.banner .no{color:var(--bad);font-weight:900}
.banner.pop{animation:bpop .45s ease}
@keyframes bpop{from{transform:scale(.94);background:rgba(233,196,106,.35)}}
.mine{flex:0 0 auto;padding:8px 10px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(rgba(0,0,0,0),rgba(0,0,0,.3) 30%);border-top:1px solid var(--line)}
.me-h{display:flex;align-items:center;gap:6px;font-weight:800;font-size:13px;margin-bottom:6px}
.me-h small{color:var(--mute);font-weight:700;font-size:11px}
.me-h.cur{color:var(--gold)}
.myrow{display:flex;gap:5px;justify-content:center;align-items:flex-end;padding:8px 0 6px;flex-wrap:nowrap}
.myrow .t{--tw:38px}
.drawn{display:flex;align-items:center;gap:8px;justify-content:center;font-size:12px;font-weight:800;color:var(--gold);margin-bottom:2px}
.drawn .t{--tw:30px}
.myrow .t.pick{cursor:pointer;animation:breathe 1.2s ease-in-out infinite;outline:2px dashed var(--sel);outline-offset:2px}
.slot{flex:0 0 auto;width:16px;height:52px;border-radius:7px;border:2px dashed var(--sel);background:rgba(255,211,90,.15);animation:breathe 1.4s infinite}
.myrow.placing .t{--tw:31px}
.acts{display:flex;gap:8px;margin-top:6px}
.acts button{flex:1;padding:13px 6px;border-radius:14px;border:0;font-weight:900;font-size:15px}
.acts .pri{background:linear-gradient(#f5d77f,#e3b54a);color:#2a1d00;box-shadow:0 4px 0 #9c7623}
.acts .sec{background:rgba(255,255,255,.1);border:1px solid var(--line)}
.help{margin-top:6px;font-size:12px;color:#d7d2ea;text-align:center;line-height:1.45;min-height:17px}
.help b{color:var(--gold)}
.helpbar{display:flex;justify-content:center;margin-top:6px}
.htog{display:flex;align-items:center;gap:8px;padding:5px 10px;border-radius:99px;border:1px solid var(--line);background:rgba(255,255,255,.05);font-size:12px;font-weight:800}
.htog .tog{width:40px;height:22px}.htog .tog::after{width:16px;height:16px}.htog .tog.on::after{left:21px}

/* ---------- 시트(숫자 고르기, 카운팅, 메뉴) ---------- */
.dim{position:fixed;inset:0;z-index:40;background:rgba(5,4,14,.6);display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.dim.center{align-items:center;padding:16px}
@keyframes fade{from{opacity:0}}
.sheet{width:100%;max-width:520px;max-height:88%;overflow:auto;background:#26223f;border-radius:22px 22px 0 0;padding:16px 14px calc(16px + env(safe-area-inset-bottom));border-top:1px solid rgba(255,255,255,.2);animation:up .2s ease}
.center .sheet{border-radius:22px;animation:none}
@keyframes up{from{transform:translateY(40px);opacity:.5}}
.sheet h2{margin:0 0 4px;font-size:17px;display:flex;align-items:center;gap:8px}
.sheet .sh-sub{color:var(--mute);font-size:12.5px;margin:0 0 12px;line-height:1.5}
.nums{display:grid;grid-template-columns:repeat(6,1fr);gap:7px}
.nb{position:relative;aspect-ratio:1/1.15;border-radius:12px;font:900 22px Georgia,serif;display:flex;align-items:center;justify-content:center}
.nb.b{background:linear-gradient(160deg,#3a3946,#15141c);color:#fff;border:1px solid #5c5a6c}
.nb.w{background:linear-gradient(160deg,#fff,#dcd8cf);color:#1b1a22;border:1px solid #bdb8ad}
.nb.on{outline:3px solid var(--sel);outline-offset:2px;transform:scale(1.06)}
.nb[disabled]{opacity:.22;cursor:not-allowed}
.nb[disabled]::after{content:"";position:absolute;left:12%;right:12%;top:50%;height:2px;background:#ff6b6b;transform:rotate(-30deg)}
.nb.jk{grid-column:span 2;aspect-ratio:auto;font-size:15px}
.cnt-t{width:100%;table-layout:fixed;border-collapse:separate;border-spacing:3px;margin:2px 0 6px}
.cnt-t td{text-align:center}
.cc{display:inline-flex;width:100%;aspect-ratio:1/1.25;border-radius:7px;align-items:center;justify-content:center;font:900 14px Georgia,serif;position:relative}
.cc.b{background:#1a1922;color:#fff;border:1px solid #57556a}.cc.w{background:#efebe3;color:#1b1a22;border:1px solid #bdb8ad}
.cc.gone{opacity:.25}
.cc.mine{box-shadow:0 0 0 2px #6ab7ff}
.cc.unk{box-shadow:0 0 0 2px var(--gold)}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:11.5px;color:var(--mute);margin:4px 0 10px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;vertical-align:-1px;margin-right:4px}
.sumline{font-size:13px;margin:6px 0 10px;line-height:1.6}
.sumline b{color:var(--gold)}
.loglist{max-height:220px;overflow:auto;font-size:12.5px;line-height:1.55;background:rgba(0,0,0,.2);border-radius:12px;padding:8px 10px}
.loglist .ok{color:var(--ok)}.loglist .no{color:var(--bad)}
.menu button{display:block;width:100%;text-align:left;padding:14px;margin-bottom:8px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.06);font-weight:800;font-size:15px}
.rules{font-size:13.5px;line-height:1.7;color:#e6e1f3}
.rules h4{margin:14px 0 4px;color:var(--gold);font-size:14px}
.rules ul{margin:0;padding-left:18px}
.toast{position:fixed;left:50%;top:calc(60px + env(safe-area-inset-top));transform:translateX(-50%);z-index:60;background:rgba(15,12,30,.95);border:1px solid var(--line);padding:10px 16px;border-radius:12px;font-size:13.5px;font-weight:700;max-width:90%;text-align:center;animation:fade .2s}
.endbox{text-align:center}
.endbox .crown{font-size:52px}
.rank{margin:10px 0 14px;text-align:left}
.rank div{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:12px;background:rgba(255,255,255,.06);margin-bottom:6px;font-weight:800}
.rank div b{width:24px;color:var(--gold)}
.think{display:inline-block;width:14px;text-align:left}
.think::after{content:"…";animation:dots 1s steps(3) infinite}
@keyframes dots{0%{content:"."}33%{content:".."}66%{content:"..."}}
.flash{position:fixed;inset:0;pointer-events:none;z-index:30;animation:fl .5s ease both}
.flash.ok{background:radial-gradient(circle,rgba(95,227,154,.35),transparent 70%)}
.flash.no{background:radial-gradient(circle,rgba(255,90,90,.3),transparent 70%)}
@keyframes fl{to{opacity:0}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const BUILD='web';
/* ===================== 다빈치 코드 규칙 엔진 =====================
   패: {id, c:'b'|'w', v:0~11|'J', up:공개여부, miss:[틀린 추측들]}
   줄 순서: 숫자 오름차순, 같은 숫자는 흑이 왼쪽. 조커는 아무 자리나. */
const COL={b:'흑',w:'백'};
const keyOf=t=>t.v==='J'?null:t.v*2+(t.c==='w'?1:0);
const vName=v=>v==='J'?'조커':String(v);
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function newGame(names,ais,opts){
  let id=0;const pool=[];
  for(const c of ['b','w'])for(let v=0;v<12;v++)pool.push({id:++id,c,v,up:false,miss:[]});
  if(opts.joker){pool.push({id:++id,c:'b',v:'J',up:false,miss:[]});pool.push({id:++id,c:'w',v:'J',up:false,miss:[]})}
  shuffle(pool);
  const n=names.length,k=n<=3?4:3;
  const G={v:1,n,opts:{count:!!opts.count,joker:!!opts.joker,tl:opts.tl|0},players:[],pool:[],cur:0,phase:'draw',drawn:null,streak:0,
    jq:[],last:null,seq:0,log:[],outOrder:[],winner:null,dealAt:Date.now(),deadline:null,turnNo:1};
  // 처음 패에는 조커가 너무 몰리지 않게: 조커는 숫자패를 다 나눈 뒤 더미에 그대로 둠(실제 게임처럼 섞여 있음)
  for(let p=0;p<n;p++){
    const hand=[];
    for(let j=0;j<k;j++)hand.push(pool.pop());
    const nums=hand.filter(t=>t.v!=='J').sort((a,b)=>keyOf(a)-keyOf(b));
    G.players.push({name:names[p],ai:!!ais[p],hand:nums,out:false});
    hand.filter(t=>t.v==='J').forEach(t=>G.jq.push({p,t}));
  }
  G.pool=pool;
  G.cur=Math.floor(Math.random()*n);
  G.phase=G.jq.length?'jokerinit':(G.pool.length?'draw':'guess');
  addLog(G,{k:'start',p:G.cur});
  return G;
}
function addLog(G,e){e.n=++G.seq;e.turn=G.turnNo;G.log.push(e);if(G.log.length>300)G.log.shift()}
function actor(G){if(G.phase==='end')return -1;if(G.phase==='jokerinit')return G.jq[0].p;return G.cur}
function alive(G){return G.players.map((p,i)=>i).filter(i=>!G.players[i].out)}
function hiddenIdx(G,p){return G.players[p].hand.map((t,i)=>i).filter(i=>!G.players[p].hand[i].up)}

/* 숫자패를 줄에 끼워 넣을 자리: 자기보다 큰 첫 숫자패 바로 앞 */
function numSlot(hand,t){const k=keyOf(t);for(let i=0;i<hand.length;i++){const kk=keyOf(hand[i]);if(kk!==null&&kk>k)return i}return hand.length}
/* 조커를 놓을 수 있는 자리 = 0..len 전부 */

function checkOut(G,p){
  const P=G.players[p];
  if(!P.out&&P.hand.length&&P.hand.every(t=>t.up)){P.out=true;G.outOrder.push(p);addLog(G,{k:'out',p})}
  const al=alive(G);
  if(al.length<=1&&G.phase!=='end'){G.phase='end';G.winner=al[0];G.deadline=null;addLog(G,{k:'win',p:al[0]})}
}
function nextTurn(G){
  if(G.phase==='end')return;
  G.drawn=null;G.streak=0;
  let c=G.cur;for(let k=0;k<G.n;k++){c=(c+1)%G.n;if(!G.players[c].out)break}
  G.cur=c;G.turnNo++;
  G.phase=G.pool.length?'draw':'guess';
  addLog(G,{k:'turn',p:c});
}
/* 행동: 성공하면 true, 규칙 위반이면 문자열(이유) */
function act(G,p,a,x){
  if(G.phase==='end')return '게임이 끝났어요';
  if(p!==actor(G))return '내 차례가 아니에요';
  const P=G.players[p];
  switch(a){
  case 'jplace':{
    if(G.phase!=='jokerinit')return '지금은 조커를 놓을 때가 아니에요';
    const i=x|0;if(i<0||i>P.hand.length)return '자리 오류';
    const q=G.jq.shift();P.hand.splice(i,0,q.t);addLog(G,{k:'jplace',p});
    if(!G.jq.length)G.phase=G.pool.length?'draw':'guess';
    return true}
  case 'draw':{
    if(G.phase!=='draw')return '지금은 패를 가져올 때가 아니에요';
    const c=x==='w'?'w':'b';const cand=G.pool.filter(t=>t.c===c);
    if(!cand.length)return COL[c]+'색 패가 남지 않았어요';
    const t=cand[Math.floor(Math.random()*cand.length)];
    G.pool.splice(G.pool.indexOf(t),1);G.drawn=t;G.phase='guess';G.drawAt=Date.now();
    addLog(G,{k:'draw',p,c});return true}
  case 'guess':{
    if(G.phase!=='guess')return '지금은 맞힐 때가 아니에요';
    const tp=x.tp|0,ti=x.ti|0,v=x.v==='J'?'J':(x.v|0);
    if(tp===p||!G.players[tp]||G.players[tp].out)return '그 사람의 패는 고를 수 없어요';
    const t=G.players[tp].hand[ti];if(!t||t.up)return '이미 공개된 패예요';
    if(v==='J'&&!G.opts.joker)return '조커가 없는 게임이에요';
    if(v!=='J'&&(v<0||v>11))return '숫자 오류';
    const ok=t.v===v;
    G.last={by:p,tp,ti,id:t.id,c:t.c,v,ok,at:Date.now(),n:G.seq+1};
    addLog(G,{k:'guess',p,tp,ti,c:t.c,v,ok,id:t.id});
    if(ok){
      t.up=true;t.upAt=Date.now();G.streak++;
      checkOut(G,tp);
      if(G.phase==='end'){if(G.drawn){placeDrawn(G,p,false,null)}return true}
      G.phase='after';return true;
    }
    if(!t.miss.includes(v))t.miss.push(v);
    if(G.drawn){
      if(G.drawn.v==='J'){G.phase='place';G.placeUp=true;return true}
      placeDrawn(G,p,true,null);checkOut(G,p);nextTurn(G);return true;
    }
    const hid=hiddenIdx(G,p);
    if(hid.length<=1){if(hid.length){P.hand[hid[0]].up=true;P.hand[hid[0]].upAt=Date.now();addLog(G,{k:'reveal',p,id:P.hand[hid[0]].id})}checkOut(G,p);nextTurn(G);return true}
    G.phase='reveal';return true}
  case 'cont':{if(G.phase!=='after')return '지금은 고를 수 없어요';G.phase='guess';return true}
  case 'stop':{
    if(G.phase!=='after')return '지금은 멈출 수 없어요';
    addLog(G,{k:'stop',p});
    if(G.drawn){if(G.drawn.v==='J'){G.phase='place';G.placeUp=false;return true}placeDrawn(G,p,false,null)}
    nextTurn(G);return true}
  case 'place':{
    if(G.phase!=='place'||!G.drawn)return '지금은 놓을 때가 아니에요';
    const i=x|0;if(i<0||i>P.hand.length)return '자리 오류';
    placeDrawn(G,p,G.placeUp,i);if(G.placeUp)checkOut(G,p);nextTurn(G);return true}
  case 'reveal':{
    if(G.phase!=='reveal')return '지금은 공개할 때가 아니에요';
    const t=P.hand[x|0];if(!t||t.up)return '숨겨진 내 패를 골라 주세요';
    t.up=true;t.upAt=Date.now();addLog(G,{k:'reveal',p,id:t.id});checkOut(G,p);nextTurn(G);return true}
  }
  return '알 수 없는 행동';
}
function placeDrawn(G,p,up,idx){
  const P=G.players[p],t=G.drawn;if(!t)return;
  t.up=up;if(up)t.upAt=Date.now();
  const i=idx==null?numSlot(P.hand,t):idx;P.hand.splice(i,0,t);G.drawn=null;
  addLog(G,{k:up?'putup':'puthid',p,id:t.id,c:t.c});
}

/* ===================== 추리(AI·카운팅 공용) =====================
   viewer가 아는 것: 공개된 모든 패 + 자기 패 + 자기가 뽑은 패 + 공개된 틀린 추측 */
function knownSet(G,viewer){
  const s=new Set();let jb=false,jw=false;
  const add=t=>{if(t.v==='J'){if(t.c==='b')jb=true;else jw=true}else s.add(keyOf(t))};
  G.players.forEach((P,pi)=>P.hand.forEach(t=>{if(t.up||pi===viewer)add(t)}));
  if(G.drawn&&G.cur===viewer)add(G.drawn);
  if(G.phase==='jokerinit'&&G.jq.length)G.jq.forEach(q=>{if(q.p===viewer)add(q.t)});
  return {s,jb,jw};
}
function fixedFor(G,viewer,tp,t){return t.up||tp===viewer}
function cands(G,viewer,tp,ti,K){
  K=K||knownSet(G,viewer);
  const row=G.players[tp].hand,t=row[ti],c=t.c,par=c==='w'?1:0;
  const isFix=j=>fixedFor(G,viewer,tp,row[j]);
  let lo=0,hi=23;
  if(!G.opts.joker){
    // 왼쪽부터 최소값, 오른쪽부터 최대값을 밀어 가며 범위를 좁힘(숨은 패마다 한 칸씩 차지)
    const L=[],H=[];let prev=-1;
    for(let j=0;j<row.length;j++){let k;if(isFix(j))k=keyOf(row[j]);else{k=prev+1;if((k&1)!==(row[j].c==='w'?1:0))k++}L[j]=k;prev=k}
    let nx=24;
    for(let j=row.length-1;j>=0;j--){let k;if(isFix(j))k=keyOf(row[j]);else{k=nx-1;if((k&1)!==(row[j].c==='w'?1:0))k--}H[j]=k;nx=k}
    lo=L[ti];hi=H[ti];
  }else{
    for(let j=ti-1;j>=0;j--)if(isFix(j)&&row[j].v!=='J'){lo=keyOf(row[j])+1;break}
    for(let j=ti+1;j<row.length;j++)if(isFix(j)&&row[j].v!=='J'){hi=keyOf(row[j])-1;break}
  }
  const out=[];
  for(let k=lo;k<=hi;k++){if((k&1)!==par)continue;if(K.s.has(k))continue;const v=k>>1;if(t.miss.includes(v))continue;out.push(v)}
  if(G.opts.joker&&!(c==='b'?K.jb:K.jw)&&!t.miss.includes('J'))out.push('J');
  return out;
}

/* ===================== AI ===================== */
function botTargets(G,p){
  const K=knownSet(G,p),res=[];
  for(const tp of alive(G)){if(tp===p)continue;
    G.players[tp].hand.forEach((t,ti)=>{if(!t.up)res.push({tp,ti,c:cands(G,p,tp,ti,K)})})}
  return res;
}
function botPick(G,p){
  const T=botTargets(G,p);if(!T.length)return null;
  T.forEach(o=>{o.sz=o.c.length||99});
  const m=Math.min(...T.map(o=>o.sz));
  const best=shuffle(T.filter(o=>o.sz===m))[0];
  let v;
  if(best.c.length){
    // 조커는 드물게만 부름(숫자 후보가 있으면 숫자 우선)
    const nums=best.c.filter(x=>x!=='J');
    v=(nums.length&&Math.random()<.85)?nums[Math.floor(Math.random()*nums.length)]:best.c[Math.floor(Math.random()*best.c.length)];
  }else v=Math.floor(Math.random()*12);
  return {tp:best.tp,ti:best.ti,v,sz:best.sz};
}
function botAction(G,p){
  const P=G.players[p];
  switch(G.phase){
  case 'jokerinit':return ['jplace',Math.floor(Math.random()*(P.hand.length+1))];
  case 'draw':{const b=G.pool.filter(t=>t.c==='b').length,w=G.pool.length-b;return ['draw',!b?'w':!w?'b':(Math.random()*(b+w)<b?'b':'w')]}
  case 'guess':{const g=botPick(G,p);return g?['guess',g]:null}
  case 'after':{
    const g=botPick(G,p);if(!g)return ['stop'];
    const pr=1/g.sz,lastOpp=alive(G).length===2&&hiddenIdx(G,g.tp).length===1;
    return (pr>=.5||lastOpp&&pr>=.34||(pr>=.25&&Math.random()<.25))?['cont']:['stop']}
  case 'place':return ['place',Math.floor(Math.random()*(P.hand.length+1))];
  case 'reveal':{const h=hiddenIdx(G,p);return ['reveal',h[Math.floor(Math.random()*h.length)]]}
  }
  return null;
}

let AC=null,bgmT=null,bgmStep=0;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}return AC}
function tone(f,t,d,o){o=o||{};const c=ac();if(!c)return;const g=c.createGain(),os=c.createOscillator();os.type=o.type||'triangle';os.frequency.setValueAtTime(f,t);
  if(o.to)os.frequency.exponentialRampToValueAtTime(o.to,t+d);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(o.vol||.15,t+.012);g.gain.exponentialRampToValueAtTime(.0005,t+d);
  os.connect(g);g.connect(o.dest||c.destination);os.start(t);os.stop(t+d+.05)}
function click(t,f,vol){const c=ac();const b=c.createBuffer(1,c.sampleRate*.04,c.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,3);
  const s=c.createBufferSource(),bp=c.createBiquadFilter(),g=c.createGain();bp.type='bandpass';bp.frequency.value=f||2200;g.gain.value=vol||.35;s.buffer=b;s.connect(bp);bp.connect(g);g.connect(c.destination);s.start(t)}
const mf=m=>440*Math.pow(2,(m-69)/12);
function sfx(n){if(!CFG.sfx)return;const c=ac();if(!c||c.state!=='running')return;const t=c.currentTime+.01;
  if(n==='tap')click(t,2600,.25);
  else if(n==='draw'){click(t,1500,.4);click(t+.06,2400,.3)}
  else if(n==='place'){click(t,900,.5);click(t+.05,1300,.35)}
  else if(n==='ok'){[72,76,79,84].forEach((m,k)=>tone(mf(m),t+k*.07,.4,{vol:.13}))}
  else if(n==='no'){tone(220,t,.35,{type:'sawtooth',to:150,vol:.07});tone(207,t+.05,.35,{type:'square',to:140,vol:.04})}
  else if(n==='flip'){click(t,3200,.3);tone(mf(88),t+.02,.15,{vol:.06})}
  else if(n==='turn'){tone(mf(79),t,.18,{vol:.1});tone(mf(84),t+.09,.25,{vol:.1})}
  else if(n==='out'){[67,63,60,55].forEach((m,k)=>tone(mf(m),t+k*.12,.4,{vol:.1}))}
  else if(n==='win'){[60,64,67,72,76,79,84].forEach((m,k)=>tone(mf(m),t+k*.09,.6,{vol:.12}))}
}
/* 배경음악: 르네상스풍 류트 아르페지오 (D 도리안) */
const BGM=[[50,57,62,65],[48,55,60,64],[46,53,58,62],[45,52,57,61]];
function bgmTick(){const c=ac();if(!c||c.state!=='running'||!CFG.bgm)return;const t=c.currentTime+.05,ch=BGM[Math.floor(bgmStep/8)%4],i=bgmStep%8;
  const pat=[0,1,2,3,2,1,2,1];tone(mf(ch[pat[i]]+12),t,.9,{vol:.035,type:'triangle'});if(i===0)tone(mf(ch[0]),t,2.2,{vol:.05,type:'sine'});
  if(i===4&&Math.random()<.5)tone(mf(ch[3]+24),t+.12,.6,{vol:.018,type:'sine'});bgmStep++}

function bannerHTML(){
  const L=G.last,seqNow=G.seq;
  let html='';

  const g=evs.find(e=>e.k==='guess'||e.k==='win'||e.k==='out'||e.k==='jplace');
  const e=G.log[G.log.length-1];
  if(G.phase==='end'){html=`🏆 <b>${esc(pname(G.winner))}</b> ${G.winner===ME?'승리!':'님 승리'}<div style="display:flex;gap:6px;margin-top:5px"><button class="ib" data-a="peekall" style="height:30px;font-size:12px">🂠 숨은 패 모두 보기</button><button class="ib" data-a="result" style="height:30px;font-size:12px">🏆 결과</button></div>`}
  else if(L&&g&&g.k==='guess'){
    const tgt=L.tp===ME?'내':esc(G.players[L.tp].name)+'의';
    html=`<b>${esc(pname(L.by))}</b> → ${tgt} ${COL[L.c]} 패를 <b>${vName(L.v)}</b>(이)라고! ${L.ok?'<span class="ok">정답</span>':'<span class="no">틀림</span>'}`;
    if(e.k==='putup')html+=` · 가져온 패 공개`;else if(e.k==='reveal')html+=` · 자기 패 하나 공개`;else if(e.k==='puthid'||e.k==='stop')html+=` · 멈춤`;
    if(evs.find(x=>x.k==='out'&&x.n>L.n-1))html+=' · <span class="no">탈락자 발생</span>';

function helpText(my){

function logLines(){

/* ---------- 진행 ---------- */
let botT=null,hgT=null;
/* 행동: 방장(혼자 할 때 포함)은 바로 처리, 참가자는 방장에게 보냄 */
function doAct(p,a,x){
  if(NET&&NET.role==='guest'){if(p!==ME)return false;netSend({t:'act',a,x});UI.sel=null;UI.pick=null;UI.wait=Date.now();render();return true}
  const prev=G.seq;
  const r=act(G,p,a,x);
  if(r!==true){if(p===ME)toast(r);else if(NET)netErr(p,r);return false}
  G.botSel=null;UI.sel=null;UI.pick=null;
  setDeadline();fxFrom(prev);saveG();render();schedule();
  if(NET)netBroadcast();
  return true;
}
/* 새로 생긴 기록을 보고 소리·효과 (방장·참가자 공통) */
function fxFrom(prev){
  if(prev==null||prev<0)return;
  G.log.filter(e=>e.n>prev).forEach(e=>{
    if(e.k==='guess'){sfx(e.ok?'ok':'no');if(e.ok)setTimeout(()=>sfx('flip'),120);flash(e.ok?'ok':'no');
      if(e.tp===ME&&e.ok)vib([80,40,80]);if(e.p===ME&&!e.ok)vib(120)}
    else if(e.k==='draw')sfx('draw');
    else if(e.k==='puthid'||e.k==='putup'||e.k==='jplace')sfx('place');
    else if(e.k==='reveal')sfx('flip');
    else if(e.k==='out')setTimeout(()=>sfx('out'),350);
    else if(e.k==='win')setTimeout(()=>{sfx('win');openSheet('end')},900);
    else if((e.k==='turn'||e.k==='start')&&e.p===ME)setTimeout(()=>{sfx('turn');vib(40)},250);
  });
}
function flash(k){const d=document.createElement('div');d.className='flash '+k;document.body.appendChild(d);setTimeout(()=>d.remove(),600)}
/* 시간 제한: 방장이 사람 차례마다 마감 시각을 정함 */
function setDeadline(){
  if(!G||!isHost())return;
  if(G.phase==='end'){G.deadline=null;return}
  const A=actor(G);
  if(G.opts.tl&&!G.players[A].ai){const key=G.seq+':'+G.phase;if(G.dlKey!==key){G.dlKey=key;G.deadline=Date.now()+G.opts.tl*1000+dealLeft()}}
  else G.deadline=null;
}
function dealLeft(){return Math.max(0,G.dealAt+G.n*4*110+500-Date.now())}
function schedule(){
  clearTimeout(botT);if(!G||G.phase==='end'||!isHost())return;
  const A=actor(G);if(!G.players[A].ai)return;
  const base={jokerinit:700,draw:900,guess:1500,after:1100,place:800,reveal:900}[G.phase]||900;
  botT=setTimeout(()=>{
    if(!G||actor(G)!==A)return;
    const a=botAction(G,A);if(!a)return;
    // AI가 고르는 패를 잠깐 보여 줌
    if(a[0]==='guess'&&!window.BOT_FAST){G.botSel=a[1];render();if(NET)netBroadcast();botT=setTimeout(()=>{if(G&&actor(G)===A)doAct(A,a[0],a[1])},850);return}
    doAct(A,a[0],a[1]);
  },base+dealLeft()+(window.BOT_FAST?-base+30:0));
}
function hgTick(){
  clearInterval(hgT);
  if(!G||!G.deadline)return;
  const f=()=>{const el=$('#hg');if(!G||!G.deadline){clearInterval(hgT);return}const left=Math.ceil((G.deadline-Date.now())/1000);
    if(el){el.textContent='⏳'+Math.max(0,left);el.classList.toggle('low',left<=5)}
    if(left<=0&&isHost()){clearInterval(hgT);const A=actor(G);G.deadline=null;

/* ===================== 각자 휴대폰: 방 (MQTT 중계) =====================
   방장이 모든 판 정보를 갖고, 참가자에게는 자기에게 보여도 되는 것만 보냄.
   주제: pbg-davinci-v1/CODE/in (참가자→방장), /to/<pid> (방장→참가자), /all (방 닫힘) */
const NETP='pbg-davinci-v1/';
const BROKERS=['wss://broker.emqx.io:8084/mqtt','wss://broker.hivemq.com:8884/mqtt','wss://test.mosquitto.org:8081/mqtt'];
const HUBLINK=()=>BUILD==='web'?'<a class="hubback" href="index.html">‹ 게임 목록</a>':'';
if(BUILD==='web'){try{var _r=document.referrer,_fh=_r.indexOf(location.origin+'/')===0&&/\/(index\.html)?$/.test(_r.split(/[?#]/)[0]);if(!_fh&&!(history.state&&history.state.pbgHub)){const here=location.href;history.replaceState({pbgHub:1},'','index.html');history.pushState(null,'',here)}}catch(e){}
  addEventListener('popstate',e=>{if(e.state&&e.state.pbgHub)location.replace('index.html')})}
const MULTI_URL='https://phoneboardgame.github.io/WithClaude/davinci.html';
const rid=n=>{const a='abcdefghijkmnpqrstuvwxyz23456789';let s='';for(let i=0;i<(n||10);i++)s+=a[Math.floor(Math.random()*a.length)];return s};
const code4=()=>{const a='ABCDEFGHJKLMNPQRSTUVWXYZ';let s='';for(let i=0;i<4;i++)s+=a[Math.floor(Math.random()*a.length)];return s};
const pageURL=()=>location.href.split('#')[0].split('?')[0];
const lsGet=(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k)||'null');return v==null?d:v}catch(e){return d}};
const lsSet=(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,JSON.stringify(v))}catch(e){}};

function libReady(){return new Promise(res=>{let k=0;(function w(){if(window.mqtt&&window.mqtt.connect)return res(true);if(++k>80)return res(false);setTimeout(w,100)})()})}
function mqConnect(){
  return new Promise((res,rej)=>{let i=0;
    (function tryOne(){
      if(i>=BROKERS.length)return rej(new Error('broker'));
      let c,done=false;
      try{c=window.mqtt.connect(BROKERS[i++],{connectTimeout:6000,reconnectPeriod:2500,clean:true,clientId:'dvc_'+rid(8)})}catch(e){return tryOne()}
      const t=setTimeout(()=>{if(done)return;done=true;try{c.end(true)}catch(e){}tryOne()},7000);
      c.on('connect',()=>{if(done)return;done=true;clearTimeout(t);res(c)});
      c.on('error',()=>{});
    })();
  });
}
const dec=p=>{try{return JSON.parse(typeof p==='string'?p:new TextDecoder().decode(p))}catch(e){return null}};
function mpub(topic,obj){if(!NET||!NET.mq)return;try{NET.mq.publish(NETP+NET.code+'/'+topic,JSON.stringify(obj),{qos:1})}catch(e){}}

/* ---------- 방장 ---------- */
const roomPub=()=>({code:NET.code,players:NET.room.players.map(p=>({pid:p.pid,name:p.name,ai:!!p.ai,host:!!p.host,on:p.ai||p.host?true:p.on!==false})),opts:NET.room.opts,phase:G?'game':'room'});
function seatOf(pid){return G?G.players.findIndex(p=>p.pid===pid):-1}
function viewFor(seat){
  const c=JSON.parse(JSON.stringify(G)),end=G.phase==='end';
  if(!end){
    c.players.forEach((P,pi)=>P.hand.forEach(t=>{if(!t.up&&pi!==seat)t.v=null}));
    if(c.drawn&&c.cur!==seat)c.drawn.v=null;
    c.pool.forEach(t=>t.v=null);
    c.jq.forEach(q=>{if(q.p!==seat)q.t.v=null});
  }
  delete c.dlKey;
  return c;
}
function netBroadcast(){
  if(!NET||NET.role!=='host')return;
  const ts=Date.now(),room=roomPub();
  NET.room.players.forEach(p=>{if(p.ai||p.host)return;
    const seat=seatOf(p.pid);
    if(G&&seat>=0)mpub('to/'+p.pid,{t:'state',v:viewFor(seat),seat,room,ts});
    else mpub('to/'+p.pid,{t:'room',room,ts,watch:!!G});
  });
}
function netSave(){if(!NET)return;if(NET.role==='host')lsSet('dvc-host-'+NET.code,{room:NET.room,G,pid:NET.pid,t:Date.now()});lsSet('dvc-sess',{role:NET.role,code:NET.code,pid:NET.pid,name:NET.name,t:Date.now()})}
function netErr(seat,msg){const P=G&&G.players[seat];if(P&&P.pid)mpub('to/'+P.pid,{t:'err',m:msg})}
async function hostOpen(code,name,resume){
  NET={role:'host',code,pid:resume?resume.pid:rid(),name,mq:null,status:'연결 중…',room:resume?resume.room:{players:[{pid:null,name,host:true}],opts:{count:CFG.count,joker:CFG.joker,tl:CFG.tl}}};
  NET.room.players[0].pid=NET.pid;NET.room.players[0].name=name;
  G=resume&&resume.G||null;if(G){ME=Math.max(0,seatOf(NET.pid))}
  setHash();netSave();render();
  if(!(await libReady())){NET.status='연결 도구를 불러오지 못했어요. 인터넷을 확인해 주세요.';render();return}
  try{NET.mq=await mqConnect()}catch(e){NET.status='중계 서버에 연결하지 못했어요. 잠시 후 다시 시도해 주세요.';render();return}
  NET.status='';
  const sub=()=>{try{NET.mq.subscribe(NETP+code+'/in')}catch(e){}};sub();
  NET.mq.on('connect',()=>{NET.status='';sub();netBroadcast();render()});
  NET.mq.on('offline',()=>{NET.status='연결이 끊겼어요. 다시 연결하는 중…';render()});
  NET.mq.on('message',(t,p)=>{const d=dec(p);if(d&&typeof d.pid==='string')hostOnMsg(d)});
  clearInterval(NET.timer);
  NET.timer=setInterval(()=>{
    const now=Date.now();let ch=false;
    NET.room.players=NET.room.players.filter(p=>{
      if(p.ai||p.host)return true;
      const on=now-(p.seen||0)<12000;if(p.on!==on){p.on=on;ch=true}
      if(!G&&!on&&now-(p.seen||0)>25000){ch=true;return false} // 대기실에서 오래 없으면 빼기
      return true});
    if(ch){render();netSave()}
    netBroadcast();
  },4000);
  render();netBroadcast();
  if(G){setDeadline();schedule()}
}
function hostOnMsg(d){
  const pid=d.pid.slice(0,16);let p=NET.room.players.find(x=>x.pid===pid);
  if(d.t==='bye'){if(p&&!p.host){if(!G)NET.room.players=NET.room.players.filter(x=>x!==p);else p.on=false;toast(p.name+'님이 나갔어요');render();netSave();netBroadcast()}return}
  if(d.t==='hello'){
    const name=String(d.name||'').trim().slice(0,8)||'손님';
    if(!p){
      if(G){mpub('to/'+pid,{t:'err',m:'이미 게임이 진행 중이에요. 이번 판이 끝나면 들어올 수 있어요.',fatal:false});mpub('to/'+pid,{t:'room',room:roomPub(),ts:Date.now(),watch:true});return}
      if(NET.room.players.length>=4){mpub('to/'+pid,{t:'err',m:'방이 꽉 찼어요 (최대 4명).',fatal:true});return}
      p={pid,name,on:true,seen:Date.now()};NET.room.players.push(p);sfx('turn');toast(name+'님이 들어왔어요');
    }else{p.name=G?p.name:name;}
    p.seen=Date.now();p.on=true;render();netSave();netBroadcast();return;
  }
  if(!p)return;
  p.seen=Date.now();if(p.on===false){p.on=true;render();netBroadcast()}
  if(d.t==='act'&&G){const seat=seatOf(pid);if(seat<0)return;doAct(seat,d.a,d.x)}
}
function netStart(opts){
  if(NET.role!=='host')return;
  const ps=NET.room.players;
  if(ps.length<2){toast('2명 이상이어야 시작할 수 있어요. AI를 추가해 보세요!');return}

  opts=opts||NET.room.opts;NET.room.opts=opts;

  G=newGame(ps.map(p=>p.name),ps.map(p=>!!p.ai),opts);
  G.players.forEach((P,i)=>P.pid=ps[i].pid);

}

function closeRoom(){

}

/* ---------- 참가자 ---------- */
function netSend(o){o.pid=NET.pid;mpub('in',o)}
async function guestJoin(code,name){
  const pid=lsGet('dvc-pid-'+code,null)||rid();lsSet('dvc-pid-'+code,pid);
  NET={role:'guest',code,pid,name,mq:null,status:'방에 연결하는 중…',room:null,got:0,joined:Date.now()};
  G=null;setHash();netSave();render();
  if(!(await libReady())){NET.status='연결 도구를 불러오지 못했어요. 인터넷을 확인해 주세요.';render();return}
  try{NET.mq=await mqConnect()}catch(e){NET.status='중계 서버에 연결하지 못했어요. 잠시 후 다시 시도해 주세요.';render();return}
  const sub=()=>{try{NET.mq.subscribe([NETP+code+'/to/'+pid,NETP+code+'/all'],{},()=>netSend({t:'hello',name:NET.name}))}catch(e){}};sub();
  NET.mq.on('connect',sub);
  NET.mq.on('offline',()=>{NET.status='연결이 끊겼어요. 다시 연결하는 중…';render()});
  NET.mq.on('message',(t,p)=>{const d=dec(p);if(d)guestOnMsg(d)});
  clearInterval(NET.timer);
  NET.timer=setInterval(()=>{
    if(!NET)return;
    netSend({t:NET.got?'ping':'hello',name:NET.name});
    const gap=Date.now()-(NET.got||NET.joined);
    const st=NET.got&&gap>14000?'방장 연결을 확인하는 중… (방장 화면이 켜져 있어야 해요)':!NET.got&&gap>12000?'방을 찾지 못했어요. 방 코드가 맞는지, 방장 화면이 켜져 있는지 확인해 주세요.':'';
    if(st!==NET.status){NET.status=st;render()}
  },3500);
}
function shiftTimes(v,off){
  ['dealAt','drawAt','deadline'].forEach(k=>{if(v[k])v[k]+=off});
  if(v.last&&v.last.at)v.last.at+=off;
  v.players.forEach(P=>P.hand.forEach(t=>{if(t.upAt)t.upAt+=off}));
}
function guestOnMsg(d){
  if(d.t==='closed'){toast('방장이 방을 닫았어요');closeRoom();return}
  if(d.t==='err'){toast(d.m);if(d.fatal){NET.status=d.m;render()}return}
  NET.got=Date.now();if(NET.status){NET.status=''}
  NET.room=d.room||NET.room;NET.watch=!!d.watch;
  if(d.t==='room'){if(G){G=null;UI={sel:null,pick:null,sheet:null};closeSheet()}render();return}
  if(d.t==='state'){
    const off=Date.now()-(d.ts||Date.now());shiftTimes(d.v,off);
    const prev=G&&G.dealAt===d.v.dealAt?G.seq:null,first=!G||G.dealAt!==d.v.dealAt;
    if(first){UI={sel:null,pick:null,sheet:null};closeSheet()}
    G=d.v;ME=d.seat;UI.wait=0;
    if(UI.sel&&(G.phase!=='guess'||actor(G)!==ME)){UI.sel=null;UI.pick=null;if(UI.sheet&&UI.sheet.k==='pick')closeSheet()}
    if(first)fxFrom(0);else fxFrom(prev);
    render();
  }
}

        [6, 22, 38],

            case QRMode.MODE_ALPHA_NUM  : return 11;

            case QRMode.MODE_ALPHA_NUM  : return 13;
            case QRMode.MODE_8BIT_BYTE  : return 16;

                throw new Error("mode:" + mode);

        }

        var col = 0;

        for (row = 0; row < moduleCount; row++) {

            for (col = 0; col < moduleCount; col++) {

                var sameCount = 0;
                var dark = qrCode.isDark(row, col);

                for (var r = -1; r <= 1; r++) {

                    if (row + r < 0 || moduleCount <= row + r) {
                        continue;
                    }

                    for (var c = -1; c <= 1; c++) {

                        if (col + c < 0 || moduleCount <= col + c) {
                            continue;
                        }

                        if (r === 0 && c === 0) {
                            continue;
                        }

                        if (dark === qrCode.isDark(row + r, col + c) ) {
                            sameCount++;
                        }
                    }
                }

                if (sameCount > 5) {
                    lostPoint += (3 + sameCount - 5);
                }
            }
        }

        // LEVEL2

        for (row = 0; row < moduleCount - 1; row++) {
            for (col = 0; col < moduleCount - 1; col++) {
                var count = 0;
                if (qrCode.isDark(row,     col    ) ) count++;
                if (qrCode.isDark(row + 1, col    ) ) count++;
                if (qrCode.isDark(row,     col + 1) ) count++;
                if (qrCode.isDark(row + 1, col + 1) ) count++;
                if (count === 0 || count === 4) {
                    lostPoint += 3;
                }
            }
        }

        // LEVEL3

        for (row = 0; row < moduleCount; row++) {
            for (col = 0; col < moduleCount - 6; col++) {
                if (qrCode.isDark(row, col) && 
                        !qrCode.isDark(row, col + 1) && 
                         qrCode.isDark(row, col + 2) && 
                         qrCode.isDark(row, col + 3) && 
                         qrCode.isDark(row, col + 4) && 
                        !qrCode.isDark(row, col + 5) && 
                         qrCode.isDark(row, col + 6) ) {
                    lostPoint += 40;
                }
            }
        }

        for (col = 0; col < moduleCount; col++) {
            for (row = 0; row < moduleCount - 6; row++) {
                if (qrCode.isDark(row, col) &&
                        !qrCode.isDark(row + 1, col) &&
                         qrCode.isDark(row + 2, col) &&
                         qrCode.isDark(row + 3, col) &&
                         qrCode.isDark(row + 4, col) &&
                        !qrCode.isDark(row + 5, col) &&
                         qrCode.isDark(row + 6, col) ) {
                    lostPoint += 40;
                }
            }
        }

        // LEVEL4
        
        var darkCount = 0;

        for (col = 0; col < moduleCount; col++) {
            for (row = 0; row < moduleCount; row++) {
                if (qrCode.isDark(row, col) ) {
                    darkCount++;
                }
            }
        }
        
        var ratio = Math.abs(100 * darkCount / moduleCount / moduleCount - 50) / 5;
        lostPoint += ratio * 10;

        return lostPoint;       
    }

};

module.exports = QRUtil;

		totalDataCount += rsBlocks[x].dataCount;

            ">" +

		}
		buffer.put(QRCode.PAD0, 8);

		}

			ecdata[r][x] = (modIndex >= 0)? modPoly.get(modIndex) : 0;

	for (var y = 0; y < rsBlocks.length; y++) {
		totalCodeCount += rsBlocks[y].totalCount;
	}

			if (xx < ecdata[t].length) {
				data[index++] = ecdata[t][xx];
			}
		}
	}

};
