<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>셀레스티아</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<script src="https://unpkg.com/peerjs@1/dist/peerjs.min.js" onerror="var s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/peerjs@1/dist/peerjs.min.js';document.head.appendChild(s)"></script>
<style>
.hubback{align-self:flex-start;width:auto;display:inline-flex;align-items:center;gap:4px;padding:7px 13px;border-radius:99px;background:rgba(127,127,127,.18);border:1px solid rgba(127,127,127,.35);color:inherit;text-decoration:none;font-size:13px;font-weight:800;margin:0 0 4px;position:relative;z-index:2}

:root{
  --sky1:#bfe3ff; --sky2:#eaf6ff; --ink:#1e2a44; --muted:#5b6b88; --card:#ffffffee;
  --accent:#f59e0b; --accent2:#2563eb; --danger:#e11d48; --ok:#16a34a; --line:#d6e4f5;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;color:var(--ink);background:linear-gradient(180deg,var(--sky1),var(--sky2));}
button{font:inherit;color:inherit;border:none;cursor:pointer;background:none}
button:disabled{cursor:default}
.jua{font-family:"Jua",sans-serif}
#app{height:100dvh;height:100vh;height:100dvh;max-width:560px;margin:0 auto;position:relative}

/* ---------- lobby / room ---------- */
.lobby,.room{height:100%;overflow-y:auto;padding:28px 22px 30px;display:flex;flex-direction:column;gap:14px;align-items:stretch}
.logo{display:flex;justify-content:center;margin-top:10px}
h1{font-family:"Jua",sans-serif;font-size:44px;margin:0;text-align:center;letter-spacing:2px;color:#17345f;text-shadow:0 3px 0 #fff}
.sub{text-align:center;margin:-8px 0 8px;color:var(--muted)}
.big{padding:15px;border-radius:16px;background:#fff;font-size:18px;font-weight:700;box-shadow:0 3px 0 #b9cde6}
.big.primary{background:var(--accent);color:#fff;box-shadow:0 3px 0 #b86f00}
.big:active{transform:translateY(2px);box-shadow:none}
.big:disabled{opacity:.45}
.field{display:flex;align-items:center;gap:10px;background:#fff;border-radius:14px;padding:10px 14px;font-weight:700}
.field input{flex:1;border:none;font:inherit;font-weight:400;outline:none;background:transparent;min-width:0}
.toggle-row{display:flex;justify-content:space-between;align-items:center;background:#fff;border-radius:14px;padding:12px 14px;font-weight:700}
.switch{width:52px;height:30px;border-radius:15px;background:#cbd5e1;position:relative;transition:.2s;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px #0003}
.switch.on{background:var(--ok)}
.switch.on::after{left:25px}
.foot{font-size:12.5px;color:var(--muted);text-align:center;margin-top:auto}
.panel{background:#fff;border-radius:16px;padding:14px}
.roomhead{display:flex;gap:14px;align-items:center}
.qr{width:112px;height:112px;flex:none;background:#fff;border-radius:10px}
.code{font-family:"Jua",sans-serif;font-size:30px;letter-spacing:4px}
.link{font-size:11.5px;color:var(--muted);word-break:break-all;margin:4px 0 8px}
.small-btn{padding:7px 12px;border-radius:10px;background:#e8f1fc;font-size:13.5px;font-weight:700}
.small-btn:disabled{opacity:.4}
.plist{display:flex;flex-direction:column;gap:8px}
.pitem{display:flex;align-items:center;gap:10px;background:#f4f8fd;border-radius:12px;padding:8px 10px}
.pitem .num{font-family:"Jua",sans-serif;font-size:18px;width:22px;text-align:center;color:var(--muted)}
.pitem .nm{flex:1;font-weight:700}
.badge{font-size:11px;padding:2px 7px;border-radius:8px;background:#fde68a;margin-left:6px;font-weight:700}
.badge.ai{background:#dbeafe}
.ord{display:flex;gap:4px}
.ord button{width:30px;height:30px;border-radius:8px;background:#fff;font-size:14px}
.ord button:disabled{opacity:.3}
.netline{font-size:12.5px;font-weight:700;padding:8px 10px;border-radius:10px;background:#f1f5f9;margin-top:10px;line-height:1.45}
.netline.on{background:#dcfce7;color:#166534}.netline.off{background:#fef3c7;color:#92400e}
.badge.ph{background:#dcfce7}
.sec-title{font-weight:800;margin:0 0 8px;display:flex;justify-content:space-between;align-items:center}

/* ---------- game ---------- */
#game{height:100%;display:grid;grid-template-rows:50px 86px minmax(0,1fr) 92px 78px;min-height:0}
#game>*{min-height:0}
.top{display:flex;align-items:center;justify-content:space-between;padding:0 10px;background:#ffffffb0;border-bottom:1px solid var(--line)}
.iconbtn{width:38px;height:38px;border-radius:11px;background:#fff;font-size:19px;box-shadow:0 2px 0 #c7d7ea;display:flex;align-items:center;justify-content:center}
.topinfo{text-align:center;line-height:1.15}
.topinfo b{font-family:"Jua",sans-serif;font-size:18px;font-weight:400}
.topinfo span{font-size:11.5px;color:var(--muted);display:block}
#pbar{display:flex;gap:4px;padding:4px 5px;align-items:stretch;background:#ffffff70;border-bottom:1px solid var(--line)}
.chip{flex:1 1 0;min-width:0;border-radius:12px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px 2px;position:relative;border:2px solid transparent;transition:.2s}
.chip.active{border-color:var(--accent);box-shadow:0 0 0 3px #fbbf2466;animation:pulse 1.1s infinite}
.chip.off{opacity:.62}
.chip.me .cname{text-decoration:underline;text-underline-offset:2px}
@keyframes pulse{50%{box-shadow:0 0 0 6px #fbbf2422}}
.chip .pt{position:relative;line-height:0}
.chip .capt{position:absolute;right:-8px;top:-3px;font-size:15px;filter:drop-shadow(0 1px 1px #0005)}
.chip .cname{font-size:10.5px;font-weight:700;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}
.chip .stats{display:flex;gap:3px;font-size:10.5px;margin-top:2px}
.chip .stats button{background:#eef4fb;border-radius:6px;padding:1px 4px;font-size:10.5px;font-weight:700}
.chip .st{font-size:9px;color:var(--muted);margin-top:0}
#board{position:relative;overflow:hidden;background:linear-gradient(180deg,#9fd2ff 0%,#d8efff 100%)}
#scroll{position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain;scroll-behavior:smooth}
#rows{display:flex;flex-direction:column}
.row{height:98px;display:grid;grid-template-columns:54px 1fr 66px;align-items:center;border-bottom:1px dashed #ffffff90;position:relative}
.row.gone .isl{filter:grayscale(1);opacity:.5}
.row.shiprow{height:180px}
.row.next .isl-label{background:#fff7d6}
.lc{display:flex;align-items:center;justify-content:center}
.lc .cnt{font-family:"Jua",sans-serif;font-size:19px;font-weight:400}
.mc{position:relative;height:100%;display:flex;align-items:flex-end;justify-content:center}
.isl{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:176px;height:72px}
.isl-label{position:absolute;bottom:4px;left:50%;transform:translateX(-50%);background:#ffffffd9;border-radius:9px;padding:1px 7px;font-size:11px;font-weight:700;white-space:nowrap;z-index:1}
.rc{display:flex;flex-wrap:wrap;gap:3px;justify-content:center;align-content:center;padding:2px}
.dot{width:18px;height:18px;border-radius:50%;border:2px solid #fff;box-shadow:0 1px 2px #0003}
.ship{position:absolute;bottom:52px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;z-index:2;transition:.4s}
.gondola{display:flex;gap:2px;align-items:flex-end;background:#8b5a2b;border:2px solid #5b3a1a;border-radius:4px 4px 12px 12px;padding:3px 6px 4px;min-width:60px;justify-content:center;margin-top:-2px}
.pawn{width:20px;height:20px;border-radius:50%;border:2px solid #fff;position:relative;box-shadow:0 1px 2px #0005}
.pawn.cap{width:26px;height:26px}
.pawn.cap::after{content:"🎖";position:absolute;top:-11px;right:-7px;font-size:12px}
.bubble{position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:#fff;border-radius:12px;padding:6px 9px;font-size:11.5px;font-weight:700;width:max-content;max-width:170px;box-shadow:0 2px 8px #0003;z-index:5;animation:pop .25s}
.bubble::after{content:"";position:absolute;top:100%;left:50%;transform:translateX(-50%);border:7px solid transparent;border-top-color:#fff}
.bubble.yes{border:2px solid #86efac}.bubble.no{border:2px solid #fda4af}
@keyframes pop{from{transform:translateX(-50%) scale(.6);opacity:0}}
#dicePanel{position:absolute;right:4px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:4px;padding:5px;border-radius:12px;background:#ffffffcc;box-shadow:0 2px 8px #0002;z-index:6}
#dicePanel:empty{display:none}
.die{width:38px;height:38px;border-radius:9px;background:#fff;border:2px solid #cbd5e1;display:flex;align-items:center;justify-content:center;font-size:21px;position:relative}
.die.ign{opacity:.35}
.die.big{width:64px;height:64px;font-size:36px;border-radius:14px}
.die.sel{outline:3px solid var(--accent);outline-offset:2px}
.die.rolling{animation:shake .15s infinite}
@keyframes shake{25%{transform:rotate(-12deg)}75%{transform:rotate(12deg)}}
#toasts{position:absolute;top:8px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:5px;align-items:center;z-index:20;pointer-events:none;width:92%}
.toast{background:#1e2a44e6;color:#fff;padding:7px 12px;border-radius:12px;font-size:13px;font-weight:600;animation:tin .25s;text-align:center;max-width:100%}
.toast.hot{background:#b91c1ce6}
.toast.good{background:#15803de6}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}}
#btnbar{background:#ffffffc8;border-top:1px solid var(--line);display:flex;flex-direction:column;padding:4px 8px 6px;gap:4px}
.blabel{font-size:12.5px;text-align:center;color:var(--muted);font-weight:700;min-height:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blabel.mine{color:#b45309}
.bgrid{flex:1;display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;min-height:0}
.act{border-radius:12px;background:#fff;font-weight:800;font-size:14px;box-shadow:0 3px 0 #b9cde6;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px;line-height:1.15}
.act .em{font-size:18px}
.act.go{background:#dcfce7;box-shadow:0 3px 0 #86c99c}
.act.stop{background:#ffe4e6;box-shadow:0 3px 0 #e8a1ad}
.act.item{background:#fef3c7;box-shadow:0 3px 0 #e2c26b}
.act:disabled{opacity:.38;box-shadow:none}
.act:not(:disabled):active{transform:translateY(2px);box-shadow:none}
.act small{font-size:10.5px;font-weight:600;color:var(--muted)}

#handbar{position:relative;z-index:150;background:linear-gradient(180deg,#24365c,#1a2742);display:flex;align-items:center;padding:6px 10px 8px;gap:8px;min-width:0}
#handbar .hlabel{color:#cbd5e1;font-size:10.5px;font-weight:700;writing-mode:vertical-rl;letter-spacing:1px;flex:none}
#hand{flex:1;display:flex;align-items:flex-end;height:100%;min-width:0;padding-top:6px}
.hc{flex:none;width:50px;height:60px;border-radius:7px;background:#fff;border:2px solid #cbd5e1;position:relative;box-shadow:-2px 0 4px #0004;transition:transform .15s}
.hc .cor{position:absolute;top:0;left:0;padding:2px 3px 3px;border-radius:5px 0 8px 0;background:#f1f5f9;font-size:15px;line-height:1;display:flex;flex-direction:column;align-items:center}
.hc .cor small{font-size:8.5px;font-weight:800;color:#334155;margin-top:1px}
.hc .mid{position:absolute;bottom:3px;right:4px;font-size:22px;opacity:.25}
.hc.use{transform:translateY(-8px);border-color:#f59e0b;box-shadow:0 0 0 3px #fbbf24aa,-2px 0 4px #0004}
.hc.tr{background:#fef9c3}
.hempty{color:#94a3b8;font-size:12px}
/* ---------- modal ---------- */
body.ingame .mback{padding-bottom:86px}
.mback{position:fixed;inset:0;background:#0f172a8c;display:flex;align-items:center;justify-content:center;z-index:100;padding:14px;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.modal{background:#fff;border-radius:20px;width:100%;max-width:470px;max-height:88vh;overflow-y:auto;padding:18px 16px;position:relative;box-shadow:0 10px 40px #0005}
.modal h2{font-family:"Jua",sans-serif;font-weight:400;margin:0 0 10px;font-size:23px;text-align:center}
.modal h3{margin:14px 0 6px;font-size:15px}
.modal p,.modal li{font-size:14px;line-height:1.55}
.modal ul{padding-left:20px;margin:6px 0}
.mclose{position:absolute;top:10px;right:10px;width:34px;height:34px;border-radius:50%;background:#f1f5f9;font-size:17px}
.mbtns{display:flex;gap:8px;margin-top:14px}
.mbtns button{flex:1;padding:12px;border-radius:12px;background:#e8f1fc;font-weight:800}
.mbtns button.primary{background:var(--accent);color:#fff}
.mbtns button:disabled{opacity:.4}
.colorgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.cpick{border-radius:16px;padding:6px 4px 8px;background:#f8fafc;display:flex;flex-direction:column;align-items:center;gap:4px;border:3px solid transparent;position:relative}
.cpick:not(:disabled):active{transform:scale(.97)}
.cpick.taken{opacity:.5}
.cpick .who{font-size:12px;font-weight:800;min-height:16px}
.cpick .ab{font-size:10.5px;color:var(--muted);line-height:1.3;text-align:center}
.dicebox{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:14px 0}
.cards{display:flex;flex-wrap:wrap;gap:7px}
.card{width:74px;min-height:96px;border-radius:10px;border:2px solid #e2e8f0;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:4px;font-size:11px;font-weight:700;text-align:center;line-height:1.2;position:relative}
.card .ci{font-size:26px}
.card.usable{border-color:var(--accent);box-shadow:0 0 0 3px #fbbf2455;animation:pulse 1.2s infinite}
.card.picked{background:#fff7d6;border-color:#b45309}
.card .tag{position:absolute;top:2px;left:3px;font-size:9px;color:var(--muted)}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl td,.tbl th{padding:6px 4px;border-bottom:1px solid #eef2f7;text-align:center}
.tbl td:first-child,.tbl th:first-child{text-align:left}
.tbl tr.click{cursor:pointer}
.tbl tr.click td:first-child{color:var(--accent2);text-decoration:underline;text-underline-offset:2px}
.muted{color:var(--muted);font-size:12.5px}
.opt-list{display:flex;flex-direction:column;gap:8px}
.opt-list button{padding:12px;border-radius:12px;background:#f1f5f9;font-weight:800;display:flex;align-items:center;gap:10px;text-align:left}
.rank{display:flex;align-items:center;gap:10px;padding:8px;border-radius:12px;background:#f8fafc;margin-bottom:6px}
.rank .sc{margin-left:auto;font-family:"Jua",sans-serif;font-size:22px}
.loglist{font-size:12.5px;line-height:1.6;max-height:60vh;overflow-y:auto}
.seg{display:flex;background:#f1f5f9;border-radius:10px;padding:3px}
.seg button{flex:1;padding:7px;border-radius:8px;font-weight:700;font-size:13px}
.seg button.on{background:#fff;box-shadow:0 1px 3px #0002}
.menu-list{display:flex;flex-direction:column;gap:8px}
.menu-list>button{padding:13px;border-radius:12px;background:#f1f5f9;font-weight:800;text-align:left}
</style>

/* 휴대폰 뒤로 가기를 누르면 게임 목록(로비)으로: 게임 주소로 바로 들어온 경우에도 */

})();

                         qrCode.isDark(row + 2, col) &&
                         qrCode.isDark(row + 3, col) &&

				if (this.modules[row][col] !== null) {
					continue;
				}
				
				for (var r = -2; r <= 2; r++) {
				
					for (var c = -2; c <= 2; c++) {
					
						if (Math.abs(r) === 2 || 
                            Math.abs(c) === 2 ||
                            (r === 0 && c === 0) ) {
							this.modules[row + r][col + c] = true;
						} else {
							this.modules[row + r][col + c] = false;
						}
					}
				}
			}
		}
	},
	
	setupTypeNumber : function(test) {
	
		var bits = QRUtil.getBCHTypeNumber(this.typeNumber);
        var mod;
	
		for (var i = 0; i < 18; i++) {
			mod = (!test && ( (bits >> i) & 1) === 1);
			this.modules[Math.floor(i / 3)][i % 3 + this.moduleCount - 8 - 3] = mod;
		}
	
		for (var x = 0; x < 18; x++) {
			mod = (!test && ( (bits >> x) & 1) === 1);
			this.modules[x % 3 + this.moduleCount - 8 - 3][Math.floor(x / 3)] = mod;
		}
	},
	
	setupTypeInfo : function(test, maskPattern) {
	
		var data = (this.errorCorrectLevel << 3) | maskPattern;
		var bits = QRUtil.getBCHTypeInfo(data);
        var mod;
	
		// vertical		
		for (var v = 0; v < 15; v++) {
	
			mod = (!test && ( (bits >> v) & 1) === 1);
	
			if (v < 6) {
				this.modules[v][8] = mod;
			} else if (v < 8) {
				this.modules[v + 1][8] = mod;
			} else {
				this.modules[this.moduleCount - 15 + v][8] = mod;
			}
		}
	
		// horizontal
		for (var h = 0; h < 15; h++) {
	
			mod = (!test && ( (bits >> h) & 1) === 1);
			
			if (h < 8) {
				this.modules[8][this.moduleCount - h - 1] = mod;
			} else if (h < 9) {
				this.modules[8][15 - h - 1 + 1] = mod;
			} else {
				this.modules[8][15 - h - 1] = mod;
			}
		}
	
		// fixed module
		this.modules[this.moduleCount - 8][8] = (!test);
	
	},
	
	mapData : function(data, maskPattern) {
		
		var inc = -1;
		var row = this.moduleCount - 1;
		var bitIndex = 7;
		var byteIndex = 0;
		
		for (var col = this.moduleCount - 1; col > 0; col -= 2) {
	
			if (col === 6) col--;
	
			while (true) {
	
				for (var c = 0; c < 2; c++) {
					
					if (this.modules[row][col - c] === null) {
						
						var dark = false;
	
						if (byteIndex < data.length) {
							dark = ( ( (data[byteIndex] >>> bitIndex) & 1) === 1);
						}
	
						var mask = QRUtil.getMask(maskPattern, row, col - c);
	
						if (mask) {

						}
						
						this.modules[row][col - c] = dark;

						if (bitIndex === -1) {
							byteIndex++;

						}
					}
				}
								
				row += inc;
	
				if (row < 0 || this.moduleCount <= row) {
					row -= inc;
					inc = -inc;
					break;
				}
			}
		}
		
	}

};

QRCode.PAD0 = 0xEC;
QRCode.PAD1 = 0x11;

QRCode.createData = function(typeNumber, errorCorrectLevel, dataList) {
	
	var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectLevel);
	
	var buffer = new QRBitBuffer();
	
	for (var i = 0; i < dataList.length; i++) {
		var data = dataList[i];
		buffer.put(data.mode, 4);
		buffer.put(data.getLength(), QRUtil.getLengthInBits(data.mode, typeNumber) );
		data.write(buffer);
	}

	// calc num max data.
	var totalDataCount = 0;
	for (var x = 0; x < rsBlocks.length; x++) {
		totalDataCount += rsBlocks[x].dataCount;
	}

	if (buffer.getLengthInBits() > totalDataCount * 8) {
		throw new Error("code length overflow. (" + 
            buffer.getLengthInBits() + 
            ">" +  
            totalDataCount * 8 + 
            ")");
	}

	// end code
	if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
		buffer.put(0, 4);
	}

	// padding
	while (buffer.getLengthInBits() % 8 !== 0) {
		buffer.putBit(false);
	}

	// padding
	while (true) {
		
		if (buffer.getLengthInBits() >= totalDataCount * 8) {
			break;
		}
		buffer.put(QRCode.PAD0, 8);
		
		if (buffer.getLengthInBits() >= totalDataCount * 8) {
			break;
		}
		buffer.put(QRCode.PAD1, 8);
	}

	return QRCode.createBytes(buffer, rsBlocks);
};

QRCode.createBytes = function(buffer, rsBlocks) {

	var offset = 0;
	
	var maxDcCount = 0;
	var maxEcCount = 0;
	
	var dcdata = new Array(rsBlocks.length);
	var ecdata = new Array(rsBlocks.length);
	
	for (var r = 0; r < rsBlocks.length; r++) {

		var dcCount = rsBlocks[r].dataCount;
		var ecCount = rsBlocks[r].totalCount - dcCount;

		maxDcCount = Math.max(maxDcCount, dcCount);
		maxEcCount = Math.max(maxEcCount, ecCount);
		
		dcdata[r] = new Array(dcCount);
		
		for (var i = 0; i < dcdata[r].length; i++) {
			dcdata[r][i] = 0xff & buffer.buffer[i + offset];
		}
		offset += dcCount;
		
		var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
		var rawPoly = new QRPolynomial(dcdata[r], rsPoly.getLength() - 1);

		var modPoly = rawPoly.mod(rsPoly);
		ecdata[r] = new Array(rsPoly.getLength() - 1);
		for (var x = 0; x < ecdata[r].length; x++) {
            var modIndex = x + modPoly.getLength() - ecdata[r].length;
			ecdata[r][x] = (modIndex >= 0)? modPoly.get(modIndex) : 0;
		}

	}
	
	var totalCodeCount = 0;
	for (var y = 0; y < rsBlocks.length; y++) {
		totalCodeCount += rsBlocks[y].totalCount;
	}

	var data = new Array(totalCodeCount);
	var index = 0;

	for (var z = 0; z < maxDcCount; z++) {
		for (var s = 0; s < rsBlocks.length; s++) {
			if (z < dcdata[s].length) {
				data[index++] = dcdata[s][z];
			}
		}
	}

	for (var xx = 0; xx < maxEcCount; xx++) {
		for (var t = 0; t < rsBlocks.length; t++) {
			if (xx < ecdata[t].length) {
				data[index++] = ecdata[t][xx];
			}
		}
	}

	return data;

};

module.exports = QRCode;

function cardIcon(c){
  if(c.t==='eq') return SYM[c.s].toolIcon;
  if(c.t==='turbo') return '⚙️';
  if(c.t==='pw') return POWER[c.p].icon;
  if(c.t==='help') return '🤝'+SYM[c.s].toolIcon;
  if(c.t==='up') return SYM[c.s].toolIcon+SYM[c.s].toolIcon;
  if(c.t==='spy') return '🔭';
  if(c.t==='tr') return '💎';
  return '?';
}
function cardName(c){
  if(c.t==='eq') return SYM[c.s].tool;
  if(c.t==='turbo') return '터보';
  if(c.t==='pw') return POWER[c.p].name;
  if(c.t==='help') return '작은 도움·'+SYM[c.s].tool;
  if(c.t==='up') return '상급 '+SYM[c.s].tool;
  if(c.t==='spy') return '마법 망원경';
  if(c.t==='tr') return c.v+'점';
  return '';
}
function cardInfo(c){
  if(c.t==='eq') return {name:SYM[c.s].tool,icon:SYM[c.s].toolIcon,when:'선장일 때, 재난을 극복하는 순간.',eff:`${SYM[c.s].ev}(${SYM[c.s].evIcon}) 주사위 1개를 막습니다. 갖고 있으면 반드시 내야 합니다.`};
  if(c.t==='turbo') return TURBO_INFO;
  if(c.t==='pw') return POWER[c.p];
  if(c.t==='help') return {...HELP_INFO,name:'작은 도움·'+SYM[c.s].tool,icon:'🤝'};
  if(c.t==='up') return {...UP_INFO,name:'상급 '+SYM[c.s].tool};
  if(c.t==='spy') return SPY_INFO;
  return {name:cardName(c),icon:'💎',when:'-',eff:'점수 카드입니다.'};
}

function cityAvg(i){const c=CITIES[i].cards;return c.reduce((s,v)=>s+(v==='S'?2:v),0)/c.length}
function drawCard(){if(!G.deck.length){G.deck=shuffle(G.discard);G.discard=[];if(G.deck.length)log('덱을 다 써서 버린 카드를 섞었습니다');}return G.deck.pop()||null}
function log(s){G.log.push(`[${G.journey}여정] ${s}`)}
function removeFromHand(p,c){const k=p.hand.indexOf(c);if(k>=0)p.hand.splice(k,1)}

function buildDeck(exp){
  const d=[];
  for(const s of SYMS)for(let k=0;k<EQ_COUNT[s];k++)d.push({id:uid(),t:'eq',s});
  for(let k=0;k<8;k++)d.push({id:uid(),t:'turbo'});
  for(const p in POWER){if(POWER[p].exp&&!exp)continue;for(let k=0;k<POWER[p].n;k++)d.push({id:uid(),t:'pw',p});}
  if(exp){
    for(const s of SYMS){for(let k=0;k<HELP_COUNT[s];k++)d.push({id:uid(),t:'help',s});for(let k=0;k<UP_COUNT[s];k++)d.push({id:uid(),t:'up',s});}
  }
  return d;
}

function startGame(){
  GEN++; pending=null; rejectRemoteAsks(); closeAllModals(); endModal=null; colorModal=null;
  const R=ROOM;
  const players=R.players.map(p=>({id:p.id,name:p.name,isAI:p.isAI,remote:!!p.remote,color:null,hand:[],tr:[],status:'on',risk:p.isAI?0.8+Math.random()*0.45:1,trust:Math.random()*0.6,charUsed:false,lastDrawn:null}));
  const all=buildDeck(R.exp);
  G={players,exp:R.exp,allCards:all.slice(),deck:shuffle(all.slice()),discard:[],
    cities:CITIES.map((c,i)=>({pile:shuffle(c.cards.map(v=>v==='S'?{id:uid(),t:'spy',city:i}:{id:uid(),t:'tr',city:i,v}))})),
    ship:0,farthest:0,captain:0,dice:[],offMarks:CITIES.map(()=>[]),bubble:null,bubbleCd:0,journey:0,log:[],phase:'setup',active:null,
    helpPool:[],helpBy:new Set(),helpLocked:false,helpNew:false,temp:[],extraDice:0,setAside:0,legLeft:new Set(),me:R.players.findIndex(p=>p.id==='me')};
  const hs=players.length<=3?8:6;
  for(const p of players)for(let k=0;k<hs;k++)p.hand.push(drawCard());
  renderGameShell();render();
  runGame().catch(e=>{if(e!==ABORT){console.error(e);toast('오류: '+e.message,'hot')}});
}
function exitGame(toRoom){
  GEN++;const pd=pending;pending=null;if(pd)pd.reject(ABORT);rejectRemoteAsks();
  closeAllModals();G=null;diceModal=null;colorModal=null;endModal=null;
  if(toRoom&&ROOM){ROOM.players=ROOM.players.filter(p=>!p.remote||NET.conns.has(p.id));renderRoom();sendRoom();}
  else{bc({t:'closed'});netClose();ROOM=null;renderLobby();}
}

/* ---------- 사람 입력 대기 ---------- */
function ask(pid,kind,info){
  if(P(pid).remote)return askRemote(pid,kind,info);
  const g=GEN;
  return new Promise((resolve,reject)=>{
    pending={pid,kind,info:info||{},resolve:v=>{pending=null;if(G)G.active=null;if(g!==GEN)return reject(ABORT);render();resolve(v)},reject};
    G.active=pid;render();buzz();sfx('turn');
  });
}
async function decide(i,kind,info){
  if(P(i).isAI){
    G.active=i;render();
    await sleep(kind==='window'?450:800);
    const v=aiDecide(i,kind,info||{});
    G.active=null;return v;
  }
  return ask(i,kind,info);
}

/* ================= 진행 ================= */
async function runGame(){
  await colorPick();
  G.captain=0;let first=true;
  while(true){
    if(!first){
      if(G.players.some(p=>score(p)>=50)){toast('50점 이상인 탐험가가 나왔습니다!','good');await sleep(1200);break;}
      if(firstCity()==null){toast('모든 섬의 보물이 바닥났습니다','good');await sleep(1200);break;}
    }
    startJourney(first);first=false;
    await sleep(700);
    let end=false;
    while(!end)end=await playLeg();
    G.captain=(G.captain+1)%N();
    await sleep(1100);
  }
  showEnd();
}

function startJourney(first){
  G.journey++;
  for(const p of G.players){p.status='on';p.lastDrawn=null}
  G.offMarks=CITIES.map(()=>[]);
  G.ship=firstCity();G.farthest=G.ship;G.helpLocked=false;G.bubble=null;G.dice=[];
  if(!first){for(const p of G.players){const c=drawCard();if(c)p.hand.push(c)}}
  log(`새 여정 시작 (선장 ${P(G.captain).name})`);
  toast(first?`첫 여정! 선장은 ${P(G.captain).name}`:`${G.journey}번째 여정 · 모두 카드 1장씩 받음`,'good');
  render();scrollToShip(false);
}

async function playLeg(){
  G.dice=[];G.bubble=null;G.helpPool=[];G.helpBy=new Set();G.helpNew=false;G.temp=[];G.extraDice=0;G.setAside=0;G.legLeft=new Set();
  G.phase='leg';render();scrollToShip(true);
  const cap=G.captain;
  const nxt=nextCity(G.ship);
  const others=aboard().filter(i=>i!==cap);
  if(others.length===0){
    const canLand=G.cities[G.ship].pile.length>0;
    let ch=nxt==null?'land':await decide(cap,'alone',{canLand});
    if(ch==='land'){
      if(canLand){disembark(cap);toast(`${P(cap).name} 선장이 혼자 착륙했습니다`);}
      await sleep(900);return true;
    }
    toast(`${P(cap).name} 선장이 혼자 계속 날아갑니다`);
  }
  if(nxt==null){await finalArrival();return true;}
  G.phase='preroll';
  await windowLoop('preroll');
  const n=Math.max(0,CITIES[nxt].dice+G.extraDice-G.setAside);
  await rollPhase(n);
  if(aboard().some(i=>i!==G.captain)){
    G.phase='bluff';render();
    if(P(cap).isAI){G.active=cap;render();await sleep(700);aiCaptainTalk();G.active=null;}
    else{const k=await ask(cap,'bluff');setBubble(cap,k);}
    await sleep(900);
  }
  G.phase='decide';render();
  for(let k=1;k<N();k++){
    const i=(cap+k)%N();const p=P(i);
    if(p.status!=='on'||i===G.captain)continue;
    const canLeave=G.cities[G.ship].pile.length>0;
    const ch=await decide(i,'board',{canLeave});
    if(ch==='leave'&&canLeave)disembark(i);
    else{toast(`${p.name}: 탑승 유지`);log(`${p.name} 탑승 유지`);}
    render();await sleep(350);
  }
  G.phase='action';
  await windowLoop('action');
  return await resolveLoop(nxt);
}

function disembark(i,why){
  const p=P(i),pile=G.cities[G.ship].pile;
  if(!pile.length)return false;
  const c=pile.pop();p.tr.push(c);p.lastDrawn=c;p.status='off';p.offAt=G.ship;
  G.offMarks[G.ship].push(i);G.legLeft.add(i);sfx('treasure');
  const what=isMe(i)?` (${c.t==='spy'?'마법 망원경':c.v+'점'})`:'';
  toast(`${p.name}${why?' '+why:''}: 내림 · 보물 1장${what}`);log(`${p.name} ${why||'하차'} → ${CITIES[G.ship].name} 보물`);
  render();return true;
}
function reboard(i){
  const p=P(i);if(p.status==='on')return;
  if(p.lastDrawn){p.tr=p.tr.filter(c=>c!==p.lastDrawn);G.cities[p.offAt].pile.push(p.lastDrawn);p.lastDrawn=null;}
  G.offMarks[p.offAt]=G.offMarks[p.offAt].filter(x=>x!==i);
  p.status='on';G.legLeft.delete(i);
  toast(`${p.name}: 다시 태워졌습니다(보물 반납)`);log(`${p.name} 강제 탑승`);render();
}
function passCaptain(){
  const n=N();
  for(let k=1;k<n;k++){const i=(G.captain+k)%n;if(P(i).status==='on'){G.captain=i;return}}
}
async function finalArrival(){
  const n=N(),pile=G.cities[G.ship].pile;
  toast(`🏆 ${CITIES[G.ship].name} 도착! 탑승객 모두 보물을 받습니다`,'good');
  for(let k=0;k<n;k++){const i=(G.captain+k)%n;if(P(i).status==='on'&&pile.length){disembark(i,'도착');await sleep(500);}}
  G.dice=[];render();await sleep(800);
}

/* ---------- 판정 ---------- */
function needOf(dice){const n={fog:0,storm:0,bird:0,pirate:0};for(const d of dice)if(d in n)n[d]++;return n}
function coverWith(cards,need){
  // cards: 카드 배열. 반환 {deficit, turbo, pay[], turbos[]}
  need={...need};const pay=[];let deficit=0;
  for(const s of SYMS){
    let n=need[s];
    const eqs=cards.filter(c=>c.t==='eq'&&c.s===s);
    while(n>0&&eqs.length){pay.push(eqs.shift());n--}
    const ups=cards.filter(c=>c.t==='up'&&c.s===s);
    while(n>0&&ups.length){pay.push(ups.shift());n-=2}
    if(n>0)deficit+=n;
  }
  const turbos=cards.filter(c=>c.t==='turbo');
  return {deficit,turbo:turbos.length,pay,turbos};
}
function evaluate(){
  const need=needOf(G.dice);
  const helpUse=[];
  for(const h of G.helpPool)if(need[h.c.s]>0){need[h.c.s]--;helpUse.push(h)}
  for(const c of G.temp)if(c.t==='help'&&need[c.s]>0){need[c.s]--;helpUse.push({c,temp:true})}
  const pool=[...P(G.captain).hand,...G.temp.filter(c=>c.t!=='help')];
  return {...coverWith(pool,need),need,helpUse};
}
function payCards(ev,useTurbo){
  const cap=P(G.captain);const used=[...ev.pay];
  if(useTurbo)used.push(...ev.turbos.slice(0,ev.deficit));
  for(const c of used){if(cap.hand.includes(c))removeFromHand(cap,c);else G.temp=G.temp.filter(x=>x!==c);G.discard.push(c)}
  const helpN=ev.helpUse.length;
  cleanupLeg();
  const desc=used.map(c=>cardIcon(c)).join(' ');
  sfx('card');
  if(used.length||helpN)toast(`선장이 낸 카드: ${desc||'-'}${helpN?` · 작은 도움 ${helpN}장`:''}`);
  log(`선장 ${cap.name} 카드 사용: ${used.map(cardName).join(', ')||'없음'}`);
}
function cleanupLeg(){
  for(const h of G.helpPool)G.discard.push(h.c);G.helpPool=[];
  for(const c of G.temp)G.discard.push(c);G.temp=[];
}
async function resolveLoop(nxt){
  for(let guard=0;guard<25;guard++){
    G.phase='resolve';G.skipCap=false;render();
    sfx('tension');await sleep(650);sfx('tension');await sleep(650);
    const ev=evaluate();
    const canEq=ev.deficit===0, canTurbo=ev.deficit>0&&ev.deficit<=ev.turbo, canGo=canEq||canTurbo;
    let ok=false,useTurbo=false;
    if(!P(G.captain).isAI){
      const opts=eligible(G.captain,canGo?'success':'crisis');
      const ch=await ask(G.captain,'resolve',{canGo,canCrash:!canEq,turbo:canTurbo?ev.deficit:0,opts,pay:ev.pay.map(cardIcon).join(' ')});
      if(ch&&typeof ch==='object'){
        const r=await applyAction(G.captain,ch);render();
        if(r==='saved'){cleanupLeg();return await moveShip(nxt);}
        if(r==='moored'){payCards(ev,canTurbo);toast('🪢 계류줄! 비행선이 이 섬에 머뭅니다','hot');passCaptain();await sleep(900);return false;}
        continue;
      }
      G.skipCap=true;
      if(ch==='go'){ok=true;useTurbo=canTurbo;}
    }else{
      G.active=G.captain;render();await sleep(500);G.active=null;
      if(canEq)ok=true;
      else if(canTurbo){const ch=aiDecide(G.captain,'turbo',{});if(ch==='turbo'){ok=true;useTurbo=true}}
    }
    if(ok){
      toast(`${P(G.captain).name} 선장: 올라갑니다!`,'good');
      G.phase='success';render();
      const r=await windowLoop('success');
      if(r==='rerolled')continue;
      payCards(ev,useTurbo);
      if(r==='moored'){toast('🪢 계류줄! 비행선이 이 섬에 머뭅니다','hot');passCaptain();await sleep(900);return false;}
      return await moveShip(nxt);
    }
    if(G.helpPool.length){for(const h of G.helpPool)G.discard.push(h.c);G.helpPool=[];G.helpLocked=true;toast('작은 도움으로도 부족했습니다','hot');}
    toast(`${P(G.captain).name} 선장: 추락합니다!`,'hot');sfx('bad');
    G.phase='crisis';render();
    const r=await windowLoop('crisis');
    if(r==='saved'){cleanupLeg();return await moveShip(nxt);}
    if(r==='rerolled'||r==='changed')continue;
    await crash();return true;
  }
  await crash();return true;
}
async function moveShip(nxt){
  G.ship=nxt;G.farthest=nxt;G.dice=[];
  toast(`✈️ ${CITIES[nxt].name}(${CITIES[nxt].label}) 도착`,'good');log(`비행선 → ${CITIES[nxt].name}`);
  sfx('fly');render();scrollToShip(true);await sleep(900);
  if(nextCity(nxt)==null){await finalArrival();return true;}
  passCaptain();return false;
}
async function crash(){
  cleanupLeg();
  const lost=aboard().map(i=>P(i).name);
  toast(`💥 추락! ${lost.join(', ')||'탑승객 없음'} — 이번 여정 보물 없음`,'hot');log(`추락 (${lost.join(', ')})`);
  buzz([300]);sfx('crash');G.dice=[];render();await sleep(1400);
}

/* ---------- 카드 사용 창 ---------- */
function passengersFor(i){return aboard().filter(j=>j!==G.captain&&j!==i)}
function purpleTargets(i){
  const p=P(i);
  if(p.status==='on')return [...G.legLeft].filter(j=>j!==i);
  if(G.legLeft.has(i)&&G.cities[G.ship].pile.length)return passengersFor(i);
  return [];
}
function eligible(i,kind){
  if(G.skipCap&&i===G.captain&&(kind==='success'||kind==='crisis'))return [];
  const p=P(i),on=p.status==='on',isCap=i===G.captain,o=[];
  const has=pw=>p.hand.find(c=>c.t==='pw'&&c.p===pw);
  const add=c=>{if(c)o.push({type:'card',card:c})};
  if(kind==='preroll'&&G.exp){
    add(has('bandit'));
    const nxt=nextCity(G.ship);
    if(p.color==='black'&&!p.charUsed&&nxt!=null&&CITIES[nxt].dice+G.extraDice-G.setAside>0)o.push({type:'char',c:'black'});
  }
  if(kind==='action'){
    if(on&&G.cities[G.ship].pile.length&&passengersFor(i).length)add(has('eject'));
    if(G.exp&&p.color==='purple'&&!p.charUsed&&purpleTargets(i).length)o.push({type:'char',c:'purple'});
  }
  if(kind==='success'){
    if(G.dice.includes('blank'))add(has('gust'));
    if(G.exp)add(has('mooring'));
  }
  if(kind==='crisis'){
    if(on){
      const s=p.tr.find(t=>t.t==='spy');if(s)o.push({type:'spy',card:s});
      add(has('altroute'));
      add(has('jetpack'));
    }
    if(G.exp){
      const need=needOf(G.dice);
      if(!isCap&&!G.helpLocked&&!G.helpBy.has(i)&&p.hand.some(c=>c.t==='help'&&need[c.s]>0))o.push({type:'help'});
      if(on&&!p.charUsed){
        if(p.color==='red'&&p.tr.length)o.push({type:'char',c:'red'});
        if(p.color==='blue'&&!isCap)o.push({type:'char',c:'blue'});
        if(p.color==='green'&&G.dice.includes('pirate'))o.push({type:'char',c:'green'});
        if(p.color==='yellow')o.push({type:'char',c:'yellow'});
      }
    }
  }
  return o;
}
async function windowLoop(kind){
  for(let guard=0;guard<15;guard++){
    let played=false;
    for(let k=0;k<N();k++){
      const i=(G.captain+k)%N();
      const opts=eligible(i,kind);if(!opts.length)continue;
      const act=await decide(i,'window',{kind,opts});
      if(act){played=true;const r=await applyAction(i,act);render();if(r)return r;}
    }
    if(kind==='crisis'&&G.helpNew){
      G.helpNew=false;
      toast(`작은 도움 공개: ${G.helpPool.map(h=>SYM[h.c.s].toolIcon).join(' ')}`,'good');
      return 'changed';
    }
    if(!played)break;
  }
  return null;
}
async function applyAction(i,act){
  const p=P(i);
  if(act.type==='card'){
    removeFromHand(p,act.card);G.discard.push(act.card);sfx('power');
    const pw=act.card.p,info=POWER[pw];
    toast(`${p.name}: ${info.icon} ${info.name}!`,'hot');log(`${p.name} → ${info.name}`);
    switch(pw){
      case 'bandit':G.extraDice++;return null;
      case 'eject':disembark(act.target,'(탈출 카드)');return null;
      case 'gust':await rerollDice(G.dice.map((d,k)=>d==='blank'?k:-1).filter(k=>k>=0),'🌬️ 돌풍');return 'rerolled';
      case 'mooring':return 'moored';
      case 'altroute':{
        const idx=P(G.captain).isAI?aiRerollChoice():P(G.captain).remote?await askRemote(G.captain,'rerollpick',{}):await chooseRerollHuman();
        await rerollDice(idx,'🗺️ 우회로');return 'rerolled';}
      case 'jetpack':{
        const sv=G.ship;G.ship=G.farthest;disembark(i,'🚀 제트팩 탈출');G.ship=sv;return null;}
    }
  }
  if(act.type==='spy'){
    p.tr=p.tr.filter(t=>t!==act.card);sfx('power');
    toast(`${p.name}: 🔭 마법 망원경! 모든 재난 무시`,'good');log(`${p.name} → 마법 망원경`);
    return 'saved';
  }
  if(act.type==='help'){
    for(const c of act.cards){removeFromHand(p,c);G.helpPool.push({c,by:i})}
    G.helpBy.add(i);G.helpNew=true;
    toast(`${p.name}: 작은 도움 카드 ${act.cards.length}장을 엎어 놓았습니다`);log(`${p.name} 작은 도움 ${act.cards.length}장`);
    return null;
  }
  if(act.type==='char'){
    p.charUsed=true;sfx('power');
    toast(`${p.name}: ${COLORS[p.color].name} 능력 · ${CHAR[act.c].name}!`,'hot');log(`${p.name} 캐릭터 능력: ${CHAR[act.c].name}`);
    switch(act.c){
      case 'black':G.setAside=2;return null;
      case 'purple':if(p.status==='on')reboard(act.target);else disembark(act.target,'(동행 강요)');return null;
      case 'red':{
        const low=p.tr.slice().sort((a,b)=>(a.t==='spy'?2:a.v)-(b.t==='spy'?2:b.v))[0];
        p.tr=p.tr.filter(t=>t!==low);
        await rerollDice(G.dice.map((d,k)=>d!=='ignored'?k:-1).filter(k=>k>=0),'🔁 재굴림');return 'rerolled';}
      case 'blue':G.captain=i;toast(`${p.name}이(가) 선장을 넘겨받았습니다`);return 'changed';
      case 'green':G.dice=G.dice.map(d=>d==='pirate'?'ignored':d);return 'changed';
      case 'yellow':{const a=drawCard(),b=drawCard();[a,b].forEach(c=>c&&G.temp.push(c));toast(`긴급 보급: ${[a,b].filter(Boolean).map(cardIcon).join(' ')}`);return 'changed';}
    }
  }
  return null;
}

/* ================= AI ================= */
function sampleCover(viewer,capIdx,dice,trials){
  const cap=P(capIdx);const h=cap.hand.length;
  const known=new Set([...G.discard,...P(viewer).hand,...G.temp,...G.helpPool.map(x=>x.c)].map(c=>c.id));
  const unknown=G.allCards.filter(c=>!known.has(c.id));
  const need=needOf(dice);let ok=0;
  for(let t=0;t<trials;t++){
    const a=unknown.slice();const hand=[];
    for(let k=0;k<h&&a.length;k++){const j=Math.floor(Math.random()*a.length);hand.push(a[j]);a[j]=a[a.length-1];a.pop()}
    const r=coverWith(hand,need);if(r.deficit<=r.turbo)ok++;
  }
  return ok/trials;
}
function selfRollCover(i,nd){
  let ok=0;const T=150;
  for(let t=0;t<T;t++){const d=Array.from({length:nd},rollFace);const r=coverWith(P(i).hand,needOf(d));if(r.deficit<=r.turbo)ok++}
  return ok/T;
}
function aiShouldLeave(i,alone){
  const p=P(i),cur=G.ship,nxt=nextCity(cur);
  if(nxt==null)return true;
  const now=cityAvg(cur),next=cityAvg(nxt);
  if(score(p)+now>=50)return true;
  let pr;
  if(alone)pr=selfRollCover(i,Math.max(0,CITIES[nxt].dice));
  else{
    pr=sampleCover(i,G.captain,G.dice,160);
    if(G.bubble&&G.bubble.pid===G.captain)pr+=(G.bubble.kind==='yes'?0.12:-0.12)*p.trust;
  }
  pr=Math.max(0,Math.min(1,pr));
  const stay=pr*next*1.08;
  return now>stay*p.risk;
}
function aiCaptainTalk(){
  if(!G.dice.some(d=>d in SYM)){setBubble(G.captain,'yes');return}
  const ev=evaluate();const can=ev.deficit<=ev.turbo;
  const honest=Math.random()<0.65;
  setBubble(G.captain,(can===honest)?'yes':'no');
}
function aiRerollChoice(){
  const cap=P(G.captain);const need=needOf(G.dice);const short=new Set();
  for(const s of SYMS){const have=cap.hand.filter(c=>c.t==='eq'&&c.s===s).length+2*cap.hand.filter(c=>c.t==='up'&&c.s===s).length;if(need[s]>have)short.add(s)}
  const idx=G.dice.map((d,k)=>short.has(d)?k:-1).filter(k=>k>=0);
  return idx.length?idx:G.dice.map((d,k)=>d in SYM?k:-1).filter(k=>k>=0);
}
function aiDecide(i,kind,info){
  const p=P(i);
  if(kind==='alone')return info.canLand&&aiShouldLeave(i,true)?'land':'go';
  if(kind==='board')return info.canLeave&&aiShouldLeave(i,false)?'leave':'stay';
  if(kind==='turbo')return 'turbo';
  if(kind==='window')return aiWindow(i,info.kind,info.opts);
  return null;
}
function aiWindow(i,kind,opts){
  const p=P(i),on=p.status==='on';
  const pick=f=>opts.find(f);
  const pw=k=>o=>o.type==='card'&&o.card.p===k;
  if(kind==='preroll'){
    const b=pick(pw('bandit'));if(b&&!on&&Math.random()<0.6)return b;
    const bl=pick(o=>o.type==='char'&&o.c==='black');
    if(bl&&on){const nxt=nextCity(G.ship);if(nxt!=null&&CITIES[nxt].dice>=3&&Math.random()<0.6)return bl;}
    return null;
  }
  if(kind==='action'){
    const e=pick(pw('eject'));
    if(e&&G.ship<=2&&Math.random()<0.45){const t=passengersFor(i).sort((a,b)=>P(b).tr.length-P(a).tr.length)[0];if(t!=null)return {...e,target:t};}
    const pu=pick(o=>o.type==='char'&&o.c==='purple');
    if(pu&&Math.random()<0.3)return {...pu,target:rnd(purpleTargets(i))};
    return null;
  }
  if(kind==='success'){
    if(on)return null;
    const g=pick(pw('gust'));if(g&&Math.random()<0.6)return g;
    const m=pick(pw('mooring'));if(m&&Math.random()<0.35)return m;
    return null;
  }
  if(kind==='crisis'){
    if(!on)return null;
    const spy=pick(o=>o.type==='spy');if(spy&&(G.ship>=2||Math.random()<0.4))return spy;
    const alt=pick(pw('altroute'));if(alt)return alt;
    const h=pick(o=>o.type==='help');
    if(h){const need=needOf(G.dice);const cards=[];for(const c of p.hand)if(c.t==='help'&&need[c.s]>0){cards.push(c);need[c.s]--}if(cards.length)return {...h,cards};}
    const ch=pick(o=>o.type==='char');if(ch&&(ch.c!=='red'||G.ship>=3))return ch;
    const j=pick(pw('jetpack'));if(j)return j;
    return null;
  }
  return null;
}

function setBubble(pid,kind){
  const prev=G.bubble&&G.bubble.text;let t=rnd(TALK[kind]);
  if(t===prev)t=TALK[kind][(TALK[kind].indexOf(t)+1)%TALK[kind].length];
  G.bubble={pid,kind,text:t};sfx('bubble');render();
}
function humanTalk(kind){
  if(Date.now()<G.bubbleCd)return;
  setBubble(G.me,kind);G.bubbleCd=Date.now()+3500;render();
  setTimeout(()=>{if(G)render()},3600);
}

  }
  bb.innerHTML=`<div class="blabel ${mine?'mine':''}">${esc(label)}</div><div class="bgrid">${btns.map((b,k)=>b?`<button class="act ${b.cls}" data-b="${k}" ${b.dis||!b.fn?'disabled':''}>${b.em?`<span class="em">${b.em}</span>`:''}${b.txt}${b.sub?`<small>${b.sub}</small>`:''}</button>`:'<div></div>').join('')}</div>`;

/* ---------- 토스트 ---------- */
function toast(msg,kind){
  if(NET.role==='host'&&G)bc({t:'toast',msg,kind});
  const box=$('#toasts');if(!box)return;
  const t=document.createElement('div');t.className='toast '+(kind||'');t.textContent=msg;box.appendChild(t);
  while(box.children.length>3)box.firstChild.remove();
  setTimeout(()=>t.remove(),2600*Math.max(SPEED_MUL,0.6));
}

function cardHtml(c,cls,extra){return `<button class="card ${cls||''}" ${extra||''}><span class="ci">${cardIcon(c)}</span>${esc(cardName(c))}</button>`}

function showHand(fromWindow){

    <h3>손패 ${p.hand.length}장</h3><div class="cards" id="hc">${p.hand.map((c,k)=>cardHtml(c,(usableCard(c)||(helpOpt&&c.t==='help'))?'usable':'',`data-k="${k}"`)).join('')||'<p class="muted">카드 없음</p>'}</div>
    ${spies.length?`<h3>보물 중 사용 가능</h3><div class="cards">${spies.map((c,k)=>cardHtml(c,opts.find(o=>o.card&&o.card.id===c.id)?'usable':'',`data-s="${k}"`)).join('')}</div>`:''}
    <p class="muted" style="margin-top:12px">${opts.length?'빛나는 카드를 지금 쓸 수 있어요. 눌러서 설명을 보고 사용하세요.':'카드를 누르면 설명을 볼 수 있어요.'}</p>`);

  const cc=m.querySelector('#charC');if(cc)cc.onclick=()=>{if(charOpt){showCardInfo({name:CHAR[p.color].name,icon:'🎭',when:'아래 효과에 적힌 때, 게임당 1번.',eff:CHAR[p.color].desc},()=>{m.remove();useOption(charOpt)})}};
}
function useOption(o){
  if(!pending||!pending.info.opts)return;
  const done=v=>pending&&pending.resolve(v);
  if(o.type==='card'&&o.card.p==='eject'){
    chooseTarget('누구를 내리게 할까요?',passengersFor(G.me),t=>done({...o,target:t}));return;
  }
  if(o.type==='char'&&o.c==='purple'){
    const me=P(G.me);
    chooseTarget(me.status==='on'?'누구를 다시 태울까요? (함께 남기)':'누구를 함께 내리게 할까요?',purpleTargets(G.me),t=>done({...o,target:t}));return;
  }

  const m=openModal(`<h2>${esc(title)}</h2><div class="opt-list">${list.map(i=>`<button data-t="${i}">${portrait(P(i).color,36)} ${esc(P(i).name)}</button>`).join('')}</div>`);

function pickHelp(opt){
  const p=P(G.me),need=needOf(G.dice);

  const m=openModal(`<h2>🤝 작은 도움 내기</h2><p class="muted" style="text-align:center">엎어서 낼 카드를 고르세요 (모두 결정한 뒤 한꺼번에 공개)</p><div class="cards" id="hp"></div><div class="mbtns"><button class="primary" id="hgo" disabled>내기</button></div>`);

const NET={role:'local',peer:null,ok:false,status:'',conns:new Map(),hostConn:null,myId:null,code:null,timeout:30000,hb:null,lastHost:0};

const PEER_PREFIX='celestia-ty-v1-';

function hostOpen(code){

  NET.status='connecting';
  let peer;
  try{peer=new Peer(PEER_PREFIX+code)}catch(e){NET.status='off';return}
  NET.peer=peer;
  const failT=setTimeout(()=>{if(!NET.ok&&NET.peer===peer){NET.status='off';if(!G&&ROOM)renderRoom()}},9000);
  peer.on('open',()=>{clearTimeout(failT);NET.ok=true;NET.status='on';if(!G&&ROOM)renderRoom()});

    if(!NET.ok){clearTimeout(failT);NET.status='off';if(!G&&ROOM)renderRoom()}
  });
  NET.hb=setInterval(()=>{const now=Date.now();for(const c of [...NET.conns.values()])if(now-(c.lastSeen||c.t0||now)>NET.timeout)hostOnClose(c,true)},3000);

    conn.t0=Date.now();

    conn.on('close',()=>hostOnClose(conn));
    conn.on('error',()=>hostOnClose(conn));

}
function sendRoom(){
  if(NET.role!=='host'||!ROOM)return;

}
function kick(pid){const c=NET.conns.get(pid);if(c){try{c.send({t:'reject',msg:'방장이 내보냈어요'})}catch(e){}NET.conns.delete(pid);setTimeout(()=>{try{c.close()}catch(e){}},300)}}
function hostOnData(conn,d){
  if(!d||typeof d!=='object')return;
  conn.lastSeen=Date.now();
  if(d.t==='ping'){try{conn.send({t:'pong'})}catch(e){}return}
  if(d.t==='hello'){
    const id=String(d.id||'').slice(0,20),name=String(d.name||'손님').trim().slice(0,8)||'손님';
    if(G){
      const i=G.players.findIndex(p=>p.id===id);
      if(i<0){try{conn.send({t:'reject',msg:'이미 게임이 진행 중이에요. 끝나면 다시 들어와 주세요.'})}catch(e){}return}
      const old=NET.conns.get(id);conn.pid=id;NET.conns.set(id,conn);if(old&&old!==conn){try{old.close()}catch(e){}}
      const p=G.players[i];
      if(p.wasRemote&&p.isAI){p.isAI=false;p.remote=true;p.name=p.name.replace('(AI)','');toast(`${p.name} 다시 접속했어요!`,'good');}

    if(!ROOM){try{conn.send({t:'reject',msg:'방이 없어요'})}catch(e){}return}
    const ex=ROOM.players.find(p=>p.id===id);

function hostOnClose(conn,timedOut){

/* 상태 동기화: 각자 자기 손패만 보이게 가려서 보냄 */
let syncDirty=false,syncTimer=null;
function syncSoon(){if(NET.role!=='host'||!NET.conns.size||!G)return;syncDirty=true;if(!syncTimer)syncTimer=setTimeout(flushSync,40);}
function flushSync(){
  clearTimeout(syncTimer);syncTimer=null;
  if(!syncDirty||!G||NET.role!=='host')return;syncDirty=false;
  for(const [pid,conn] of NET.conns){const i=G.players.findIndex(p=>p.id===pid);if(i<0)continue;try{conn.send({t:'state',g:viewFor(i)})}catch(e){}}
}
function bc(m){if(NET.role!=='host'||!NET.conns.size)return;flushSync();for(const c of NET.conns.values()){try{c.send(m)}catch(e){}}}

      hand:(j===i||end)?p.hand:p.hand.map(()=>({t:'x'})),tr:(j===i||end)?p.tr:p.tr.map(c=>({t:'h',city:c.city}))})),
    exp:G.exp,allCards:G.allCards,deckN:G.deck.length,discard:G.discard,piles:G.cities.map(c=>c.pile.length),spyN:G.cities.reduce((s,c)=>s+c.pile.filter(x=>x.t==='spy').length,0),

const REMOTE_ASK={};let ASK_SEQ=0;
function serInfo(info){const r={...info};if(info.opts)r.opts=info.opts.map(o=>({type:o.type,cardId:o.card?o.card.id:null,c:o.c||null}));return r}
function askRemote(pid,kind,info){
  const p=P(pid),g=GEN,id=++ASK_SEQ;info=info||{};
  return new Promise((resolve,reject)=>{
    REMOTE_ASK[p.id]={id,kind,info,reject,resolve:v=>{delete REMOTE_ASK[p.id];if(G)G.active=null;if(g!==GEN)return reject(ABORT);render();resolve(v)}};
    G.active=pid;render();flushSync();
    const conn=NET.conns.get(p.id);
    if(conn){try{conn.send({t:'ask',id,kind,info:serInfo(info)})}catch(e){}}
    else REMOTE_ASK[p.id].resolve(aiFallback(pid,kind,info));
  });
}
function rejectRemoteAsks(){for(const k in REMOTE_ASK){const r=REMOTE_ASK[k];delete REMOTE_ASK[k];try{r.reject(ABORT)}catch(e){}}}
function aiFallback(i,kind,info){
  if(kind==='roll')return true;
  if(kind==='bluff')return Math.random()<.5?'yes':'no';
  if(kind==='resolve')return info.canGo?'go':'crash';
  if(kind==='rerollpick')return aiRerollChoice();
  if(kind==='window')return null;
  return aiDecide(i,kind,info);
}
function hostAnswer(pid,d){
  const ra=REMOTE_ASK[pid];if(!ra||ra.id!==d.id)return;
  const i=G.players.findIndex(p=>p.id===pid),a=d.v;let v=null;
  const ok=(list,x)=>list.includes(x);
  if(ra.kind==='rerollpick')v=Array.isArray(a)?[...new Set(a)].filter(k=>Number.isInteger(k)&&k>=0&&k<G.dice.length&&G.dice[k]!=='ignored'):[];
  else if(ra.kind==='roll')v=true;
  else if(ra.kind==='bluff')v=a==='no'?'no':'yes';
  else if(ra.kind==='board')v=a==='leave'&&ra.info.canLeave?'leave':'stay';
  else if(ra.kind==='alone')v=a==='land'&&ra.info.canLand?'land':'go';
  else if(a&&typeof a==='object'){
    const opt=(ra.info.opts||[]).find(o=>o.type===a.type&&(o.card?o.card.id===a.cardId:true)&&(o.c||null)===(a.c||null));
    if(opt){
      v={...opt};
      if(opt.type==='card'&&opt.card.p==='eject'){if(!ok(passengersFor(i),a.target))v=null;else v.target=a.target;}
      if(v&&opt.type==='char'&&opt.c==='purple'){if(!ok(purpleTargets(i),a.target))v=null;else v.target=a.target;}
      if(v&&opt.type==='help'){const need=needOf(G.dice);v.cards=(a.cards||[]).map(id=>P(i).hand.find(c=>c.id===id&&c.t==='help')).filter(c=>c&&need[c.s]-->0);if(!v.cards.length)v=null;}
    }
  }
  else if(ra.kind==='resolve')v=a==='go'&&ra.info.canGo?'go':ra.info.canCrash?'crash':'go';
  else v=null;
  ra.resolve(v);
}

    <div class="toggle-row"><span>확장팩 · 작은 도움</span><span>${R.exp?'켜짐':'꺼짐'}</span></div>
    <div class="panel"><div class="sec-title"><span>플레이어 (${R.players.length}/6) · 위에서부터 차례</span></div>
      <div class="plist">${R.players.map((p,i)=>`<div class="pitem"><span class="num">${i+1}</span><span class="nm">${esc(p.name)}${p.host?'<span class="badge">방장</span>':''}${p.isAI?'<span class="badge ai">AI</span>':''}${p.id===NET.myId?'<span class="badge ph">나</span>':''}</span></div>`).join('')}</div></div>
    <button class="big" id="leave">나가기</button></div>`;
  $('#leave').onclick=()=>clientLeave();
}
function reviveView(v){
  return {...v,deck:Array(v.deckN).fill(null),cities:v.piles.map(n=>({pile:Array(n).fill(null)})),
    helpPool:Array(v.helpN).fill(null).map(()=>({c:{s:'fog'}})),helpBy:new Set(v.helpBy),legLeft:new Set(v.legLeft)};
}
function clientOnData(d){
  if(!d||typeof d!=='object')return;
  switch(d.t){
    case 'room':GEN++;pending=null;G=null;diceModal=null;colorModal=null;endModal=null;closeAllModals();ROOM={code:d.code,exp:d.exp,players:d.players};renderClientRoom();break;
    case 'pong':break;
    case 'reject':clientLost(d.msg||'입장할 수 없어요');break;
    case 'closed':clientLost('방장이 방을 닫았어요');break;
    case 'state':clientState(d.g);break;
    case 'ask':clientAsk(d);break;
    case 'toast':toast(d.msg,d.kind);break;
    case 'sfx':sfx(d.n);break;
    case 'dOpen':if(G)openDiceModal(d.n,d.title,d.cap,d.sub);break;
    case 'dBox':{const b=diceModal&&diceModal.querySelector('#dm-dice');if(b)b.innerHTML=d.html;break;}
    case 'dBtn':{const b=diceModal&&diceModal.querySelector('#dm-roll');if(b){b.disabled=true;b.textContent=d.text}break;}
    case 'dClose':closeDiceModal();break;
  }
}
function clientState(g){
  const prev=G,ng=reviveView(g);
  if(prev&&prev.bubble&&ng.bubble&&prev.bubble.text===ng.bubble.text)ng.bubble.seen=true;
  G=ng;
  if(!$('#game')){closeAllModals();diceModal=null;colorModal=null;endModal=null;renderGameShell();}
  if(G.phase==='color'){if(!colorModal)openColorModal();else drawColorModal();}
  else if(colorModal){colorModal.remove();colorModal=null;}
  if(pending&&G.active!==G.me)pending=null;
  render();
  if(!prev||prev.ship!==G.ship||prev.journey!==G.journey)scrollToShip(!!prev);
  if(G.phase==='end'&&!endModal)showEnd();
  if(G.phase!=='end'&&endModal){endModal.remove();endModal=null;}
}
function clientAsk(d){
  if(!G)return;
  const info={...d.info};
  const myCard=id=>{const p=P(G.me);return p.hand.find(c=>c.id===id)||p.tr.find(c=>c.id===id)};
  if(info.opts)info.opts=info.opts.map(o=>({...o,card:o.cardId!=null?myCard(o.cardId):undefined}));
  const answer=v=>{
    pending=null;
    const out=v&&typeof v==='object'&&!Array.isArray(v)?{type:v.type,cardId:v.card?v.card.id:null,c:v.c||null,target:v.target,cards:v.cards?v.cards.map(c=>c.id):undefined}:v;
    netSend({t:'answer',id:d.id,v:out});render();
  };
  buzz();sfx('turn');
  if(d.kind==='rerollpick'){chooseRerollHuman().then(idx=>netSend({t:'answer',id:d.id,v:idx}));return}
  pending={pid:G.me,kind:d.kind,info,resolve:answer,reject:()=>{}};
  render();
}

document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&NET.role==='client'&&NET.lastHost&&Date.now()-NET.lastHost>15000)clientLost('화면이 꺼진 동안 연결이 끊겼어요. 입장하기를 다시 누르면 이어서 할 수 있어요.')});

/* ================= 시작 ================= */
{
  /* 게임 선택 로비에서 함께 넘어온 경우: ?pbg=host|join&code=XXXX&name=… */
  const q=new URLSearchParams(location.search),pb=q.get('pbg'),pc=(q.get('code')||'').toUpperCase();
  const m=location.hash.match(/^#room-([A-Z]{4})$/);
  if((pb==='host'||pb==='join')&&/^[A-Z]{4}$/.test(pc)){
    const nm=(q.get('name')||'').trim().slice(0,8);if(nm){myName=nm;store('cel_name',nm)}
    const waitPeer=f=>{let k=0;(function w(){if(typeof Peer!=='undefined'||++k>60)return f();setTimeout(w,100)})()};
    if(pb==='host'){
      try{history.replaceState(null,'',location.pathname)}catch(e){}
      renderLobby();PBG.fixed=true;
      waitPeer(()=>{ROOM={code:pc,exp:expOn,players:[{id:'me',name:myName,isAI:false,host:true}]};hostOpen(pc);renderRoom()});
    }else{
      try{history.replaceState(null,'',location.pathname+'#room-'+pc)}catch(e){}
      PBG.join=true;renderJoin(pc);waitPeer(()=>clientJoin(pc));
    }
  }else if(m)renderJoin(m[1]);else renderLobby();
}
</script>
