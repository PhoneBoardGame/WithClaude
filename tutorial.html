<style>
:root{--ink:#eef4fa;--mute:#9fb6ca;--c1:#1d4f7a;--c2:#3a2462;--acc:#ffd166}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#081a30;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;overflow:hidden}
body{background:radial-gradient(120% 60% at 50% 0%,var(--c1) 0%,#0b2038 55%,#06121f 100%)}
.wrap{max-width:520px;margin:0 auto;height:100vh;height:100dvh;display:flex;flex-direction:column;padding:calc(8px + env(safe-area-inset-top)) 14px calc(10px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;gap:8px;flex:none}
.top a{color:var(--ink);text-decoration:none;font-size:13.5px;padding:8px 10px;border-radius:10px;background:rgba(255,255,255,.08);white-space:nowrap}
.top .ttl{flex:1;text-align:center;font-weight:800;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .cnt{font-size:12.5px;color:var(--mute);min-width:44px;text-align:right}
.bar{height:4px;border-radius:4px;background:rgba(255,255,255,.12);margin:8px 2px 10px;flex:none;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);border-radius:4px;transition:width .3s}
.stage{flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center}
.phone{position:relative;height:100%;max-height:100%;aspect-ratio:390/844;border-radius:24px;overflow:hidden;box-shadow:0 0 0 3px rgba(255,255,255,.18),0 14px 40px rgba(0,0,0,.55);background:#000;cursor:pointer}
.phone img{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;display:block;transition:opacity .2s}
.phone svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.ring{fill:none;stroke:var(--acc);stroke-width:3;vector-effect:non-scaling-stroke;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.card{flex:none;margin-top:10px;padding:12px 14px;border-radius:16px;background:rgba(10,20,35,.78);border:1px solid rgba(255,255,255,.12);min-height:112px}
.card h2{margin:0 0 6px;font-size:17px;letter-spacing:-.3px;color:#fff}
.card h2 .no{display:inline-block;min-width:22px;height:22px;line-height:22px;text-align:center;border-radius:11px;background:var(--acc);color:#1b1b1b;font-size:12px;margin-right:6px;vertical-align:2px}
.card p{margin:0;font-size:13.5px;line-height:1.6;color:#dbe6f0;word-break:keep-all}
.card b{color:var(--acc)}
.nav{flex:none;display:flex;gap:8px;margin-top:10px}
.nav button,.nav a{flex:1;padding:13px 8px;border-radius:14px;border:0;font:inherit;font-weight:800;font-size:15px;text-align:center;text-decoration:none;cursor:pointer}
.prev{background:rgba(255,255,255,.1);color:var(--ink)}
.prev:disabled{opacity:.35}
.next{background:var(--acc);color:#1d1d1d;flex:1.6!important}
.play{background:rgba(255,255,255,.14);color:var(--ink)}
.hint{text-align:center;font-size:11px;color:var(--mute);margin-top:6px;flex:none}
@media (max-height:640px){.card{min-height:0}.card p{font-size:12.5px;line-height:1.5}}
</style>
</head>

const INFR=window.parent!==window;
const q=new URLSearchParams(location.search),gid=q.get('g')||(location.hash||'').slice(1),GM=GAMES[gid];
if(!GM)location.replace('index.html');
let i=0;
const $=id=>document.getElementById(id);
document.documentElement.style.setProperty('--c1',GM.c1);document.documentElement.style.setProperty('--acc',GM.acc);
$('ttl').textContent=GM.name+' 튜토리얼';
const N=GM.slides.length;
/* 효과음: 게임 선택 페이지의 효과음 설정을 따름 */
let ac=null,sfxOn=true;try{sfxOn=JSON.parse(localStorage.getItem('pbg-hub-snd')||'{}').sfx!==false}catch(e){}
function blip(up){
  if(!sfxOn)return;try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();
    const t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();o.type='sine';
    o.frequency.setValueAtTime(up?660:520,t);o.frequency.exponentialRampToValueAtTime(up?990:390,t+.09);
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.12,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+.16);
    o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+.2);
  }catch(e){}
}
function show(n){
  i=Math.max(0,Math.min(N-1,n));
  const [k,h,t]=GM.slides[i];
  const img=$('img');img.style.opacity=.3;img.onload=()=>img.style.opacity=1;img.src='tutorial/'+GM.key+'_'+k+'.webp';
  if(i+1<N){const pre=new Image();pre.src='tutorial/'+GM.key+'_'+GM.slides[i+1][0]+'.webp'}
  const rs=(RECTS[GM.key]||{})[k]||[];
  $('ov').innerHTML=rs.length?`<defs><mask id="m"><rect width="100" height="100" fill="#fff"/>${rs.map(r=>`<rect x="${r[0]}" y="${r[1]}" width="${r[2]}" height="${r[3]}" rx="1.4" fill="#000"/>`).join('')}</mask></defs>
    <rect width="100" height="100" fill="rgba(0,0,0,.42)" mask="url(#m)"/>${rs.map(r=>`<rect class="ring" x="${r[0]}" y="${r[1]}" width="${r[2]}" height="${r[3]}" rx="1.4"/>`).join('')}`:'';
  $('h').innerHTML=`<span class="no">${i+1}</span>${h}`;$('t').innerHTML=t;
  $('cnt').textContent=(i+1)+' / '+N;$('bar').style.width=((i+1)/N*100)+'%';
  $('nav').innerHTML=i<N-1
    ?`<button class="prev" id="pv" ${i?'':'disabled'}>‹ 이전</button><button class="next" id="nx">다음 ›</button>`
    :`<button class="prev" id="pv">‹ 이전</button>${INFR?'':`<a class="play" href="${GM.file}">바로 플레이</a>`}<a class="next" href="index.html">${INFR?'완료 · 로비로':'완료 · 게임 선택으로'}</a>`;
  const pv=$('pv'),nx=$('nx');
  if(pv)pv.onclick=()=>{blip(false);show(i-1)};
  if(nx)nx.onclick=()=>{blip(true);show(i+1)};
}
$('phone').onclick=()=>{if(i<N-1){blip(true);show(i+1)}};
let sx=null,sy=null;
document.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
document.addEventListener('touchend',e=>{if(sx==null)return;const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;sx=null;
  if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.3){if(dx<0&&i<N-1){blip(true);show(i+1)}else if(dx>0&&i>0){blip(false);show(i-1)}}},{passive:true});
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')show(i+1);if(e.key==='ArrowLeft')show(i-1)});
show(0);
</script>
